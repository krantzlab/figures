<svg xmlns="http://www.w3.org/2000/svg" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0" sodipodi:docname="fig-hla-testing-comparison.svg" id="fig-hla-testing-comparison_svg1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" viewBox="0 0 1600 900"><sodipodi:namedview id="fig-hla-testing-comparison_namedview1" bordercolor="#000000" borderopacity=".25" pagecolor="#ffffff"><sodipodi:guide id="fig-hla-testing-comparison_guide1" orientation="0,1" position="0,820"/><sodipodi:guide id="fig-hla-testing-comparison_guide2" orientation="-1,0" position="1520,900"/><sodipodi:guide id="fig-hla-testing-comparison_guide3" orientation="0,1" position="1600,80"/><sodipodi:guide id="fig-hla-testing-comparison_guide4" orientation="-1,0" position="80,0"/></sodipodi:namedview><g id="fig-hla-testing-comparison_layer1"><path stroke="#ddd" stroke-width="1.5" d="M800 60v780"/><text x="400" y="90" fill="#999" font-size="32" font-weight="700" text-anchor="middle">High-Resolution Sequencing</text><text x="400" y="124" fill="#bbb" font-size="22" font-weight="400" text-anchor="middle">PCR sequencing of Exon 2 &amp; 3</text><text x="1200" y="90" fill="#4c86c5" font-size="32" font-weight="700" text-anchor="middle">Single-Allele Assay</text><text x="1200" y="124" fill="#7eadd4" font-size="22" font-weight="400" text-anchor="middle">PCR with allele-specific primers</text></g><g id="fig-hla-testing-comparison_layer2" text-anchor="middle"><text x="400" y="230" fill="#999" font-size="24" font-weight="400" letter-spacing="2">RESOLUTION</text><text x="400" y="280" fill="#1a1a1a" font-size="36" font-weight="600">4-digit (2-field)</text><text x="400" y="316" fill="#999" font-size="22" font-weight="400">HLA-B*57:01, B*58:01, B*15:02 ...</text><text x="400" y="350" fill="#bbb" font-size="20" font-weight="400">Determines zygosity</text><text x="1200" y="230" fill="#4c86c5" font-size="24" font-weight="400" letter-spacing="2">RESOLUTION</text><text x="1200" y="280" fill="#1a1a1a" font-size="36" font-weight="600">Present or Absent</text><text x="1200" y="316" fill="#7eadd4" font-size="22" font-weight="400">Is HLA-B*58:01 here? Yes / No</text></g><g id="fig-hla-testing-comparison_layer3" text-anchor="middle"><text x="400" y="440" fill="#999" font-size="24" font-weight="400" letter-spacing="2">USE CASE</text><text x="400" y="498" fill="#1a1a1a" font-size="30" font-weight="500">Transplant typing</text><text x="400" y="536" fill="#1a1a1a" font-size="30" font-weight="500">Research</text><text x="1200" y="440" fill="#4c86c5" font-size="24" font-weight="400" letter-spacing="2">USE CASE</text><text x="1200" y="490" fill="#1a1a1a" font-size="42" font-weight="700">Pharmacogenomics</text><text x="1200" y="536" fill="#4c86c5" font-size="26" font-weight="400">HLA-B*58:01 → allopurinol</text><text x="1200" y="568" fill="#4c86c5" font-size="26" font-weight="400">HLA-B*57:01 → abacavir</text></g><g id="fig-hla-testing-comparison_layer4" text-anchor="middle"><text x="400" y="660" fill="#999" font-size="24" font-weight="400" letter-spacing="2">COST / TIME</text><text x="400" y="720" fill="#ccc" font-size="48" font-weight="700">$$$ · Weeks</text><text x="1200" y="660" fill="#4c86c5" font-size="24" font-weight="400" letter-spacing="2">COST / TIME</text><text x="1200" y="720" fill="#4c86c5" font-size="48" font-weight="700">$ · Days</text></g><g id="fig-hla-testing-comparison_layer5" fill="#4c86c5"><rect width="680" height="60" x="860" y="790" opacity=".08" rx="8"/><text x="1200" y="828" font-size="26" font-weight="600" text-anchor="middle">Right test for the right question</text></g></svg>