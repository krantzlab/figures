<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-idt-concentration-gap_svg1" viewBox="0 0 1200 580"><defs><style>.fig-delayed-idt-concentration-gap_col-header{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#4c86c5}.fig-delayed-idt-concentration-gap_col-sub{font-family:ArialMT,Arial;font-size:17px;fill:#999}.fig-delayed-idt-concentration-gap_row-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:20px;fill:#212529}.fig-delayed-idt-concentration-gap_row-desc{font-family:ArialMT,Arial;font-size:17px;fill:#666}.fig-delayed-idt-concentration-gap_morph-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:18px;fill:#212529}.fig-delayed-idt-concentration-gap_arrow-label,.fig-delayed-idt-concentration-gap_morph-desc{font-family:ArialMT,Arial;fill:#999}.fig-delayed-idt-concentration-gap_morph-desc{font-size:16px;font-style:italic}.fig-delayed-idt-concentration-gap_arrow-label{font-size:17px}.fig-delayed-idt-concentration-gap_result-desc{font-family:ArialMT,Arial;font-size:18px}.fig-delayed-idt-concentration-gap_skin-bg{fill:#d0c4b5}.fig-delayed-idt-concentration-gap_wheal-flare{fill:#e74c3c}.fig-delayed-idt-concentration-gap_arrow-line{stroke-width:1.5}.fig-delayed-idt-concentration-gap_wheal-inner{fill:#fab1a0;stroke:#c0392b;stroke-width:1.5}.fig-delayed-idt-concentration-gap_arrow-line{fill:none;stroke:#bbb}.fig-delayed-idt-concentration-gap_arrow-head{fill:#bbb}.fig-delayed-idt-concentration-gap_threshold-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:16px;fill:#e67e22}</style></defs><g id="fig-delayed-idt-concentration-gap_layer1"><text x="600" y="30" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:26px;fill:#212529" text-anchor="middle">IDT Concentrations: Immediate vs Delayed Detection</text><text x="600" y="54" style="font-family:ArialMT,Arial;font-size:20px;fill:#666" text-anchor="middle">Standard concentrations optimized for non-irritating immediate (IgE) testing</text><text x="410" y="90" class="fig-delayed-idt-concentration-gap_col-header" text-anchor="middle">15–20 min</text><text x="410" y="110" class="fig-delayed-idt-concentration-gap_col-sub" text-anchor="middle">Immediate read</text><text x="790" y="90" class="fig-delayed-idt-concentration-gap_col-header" text-anchor="middle">24–48 hr</text><text x="790" y="110" class="fig-delayed-idt-concentration-gap_col-sub" text-anchor="middle">Delayed read</text><path d="M28 420V145" style="fill:none;stroke:#212529;stroke-width:2"/><path fill="#212529" d="M23 150h10l-5-12z"/><text x="30" y="440" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:16px;fill:#212529" text-anchor="middle" transform="rotate(-90 30 310)">Concentration</text><rect width="1090" height="170" x="55" y="125" rx="8" style="fill:#f8f9fa"/><text x="70" y="200" class="fig-delayed-idt-concentration-gap_row-label">Standard</text><text x="70" y="222" class="fig-delayed-idt-concentration-gap_row-label">IDT conc.</text><text x="70" y="244" class="fig-delayed-idt-concentration-gap_row-desc">Non-irritating</text><text x="70" y="262" class="fig-delayed-idt-concentration-gap_row-desc">(IgE-optimized)</text><circle cx="410" cy="210" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><circle cx="410" cy="210" r="42" class="fig-delayed-idt-concentration-gap_wheal-flare" opacity=".25"/><circle cx="410" cy="210" r="26" class="fig-delayed-idt-concentration-gap_wheal-inner"/><text x="410" y="280" class="fig-delayed-idt-concentration-gap_morph-label" text-anchor="middle">Wheal / flare</text><text x="410" y="298" class="fig-delayed-idt-concentration-gap_morph-desc" text-anchor="middle">e.g. vancomycin via MRGPRX2</text><path d="M520 210h120" class="fig-delayed-idt-concentration-gap_arrow-line"/><path d="M640 205v10l12-5z" class="fig-delayed-idt-concentration-gap_arrow-head"/><text x="580" y="198" class="fig-delayed-idt-concentration-gap_arrow-label" text-anchor="middle">Resolves</text><circle cx="790" cy="210" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><circle cx="790" cy="210" r="22" style="fill:none;stroke:#a89888;stroke-width:1.5;stroke-dasharray:4 3"/><circle cx="790" cy="210" r="3" style="fill:#a89888"/><text x="790" y="280" class="fig-delayed-idt-concentration-gap_morph-label" text-anchor="middle">Flat — no reaction</text><text x="960" y="200" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:24px;fill:#2d6a4f">(−)</text><text x="960" y="224" fill="#2d6a4f" class="fig-delayed-idt-concentration-gap_result-desc">Delayed</text><text x="960" y="244" fill="#2d6a4f" class="fig-delayed-idt-concentration-gap_result-desc">missed</text><path d="M55 310h1090" style="fill:none;stroke:#e67e22;stroke-width:2;stroke-dasharray:8 5"/><text x="1148" y="306" class="fig-delayed-idt-concentration-gap_threshold-label">Non-irritating</text><text x="1148" y="322" class="fig-delayed-idt-concentration-gap_threshold-label">threshold</text></g><g id="fig-delayed-idt-concentration-gap_layer2"><text x="70" y="385" class="fig-delayed-idt-concentration-gap_row-label">Higher</text><text x="70" y="407" class="fig-delayed-idt-concentration-gap_row-label">conc.</text><text x="70" y="429" class="fig-delayed-idt-concentration-gap_row-desc">Needed for</text><text x="70" y="447" class="fig-delayed-idt-concentration-gap_row-desc">delayed detection</text><circle cx="410" cy="395" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><circle cx="410" cy="395" r="42" class="fig-delayed-idt-concentration-gap_wheal-flare" opacity=".25"/><circle cx="410" cy="395" r="26" class="fig-delayed-idt-concentration-gap_wheal-inner"/><text x="410" y="465" class="fig-delayed-idt-concentration-gap_morph-label" text-anchor="middle">Wheal / flare</text><text x="410" y="483" class="fig-delayed-idt-concentration-gap_morph-desc" text-anchor="middle">Same MRGPRX2 response</text><path d="M520 395h120" class="fig-delayed-idt-concentration-gap_arrow-line"/><path d="M640 390v10l12-5z" class="fig-delayed-idt-concentration-gap_arrow-head"/><text x="580" y="383" class="fig-delayed-idt-concentration-gap_arrow-label" text-anchor="middle">Resolves,</text><text x="580" y="400" class="fig-delayed-idt-concentration-gap_arrow-label" text-anchor="middle">then...</text><circle cx="790" cy="395" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><circle cx="790" cy="395" r="38" opacity=".22" style="fill:#8e44ad"/><circle cx="790" cy="395" r="24" style="fill:#d2b4de;stroke:#8e44ad;stroke-width:2"/><text x="790" y="465" class="fig-delayed-idt-concentration-gap_morph-label" text-anchor="middle">Indurated papule</text><text x="790" y="483" class="fig-delayed-idt-concentration-gap_morph-desc" text-anchor="middle">T-cell mediated infiltration</text><text x="960" y="385" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:24px;fill:#8e44ad">(+)</text><text x="960" y="409" fill="#8e44ad" class="fig-delayed-idt-concentration-gap_result-desc">Delayed</text><text x="960" y="429" fill="#8e44ad" class="fig-delayed-idt-concentration-gap_result-desc">detected</text><path stroke="#e0e0e0" d="M55 510h1090"/><text x="600" y="540" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:18px;fill:#212529" text-anchor="middle">
      Standard IDT concentrations may miss delayed hypersensitivity —
    </text><text x="600" y="564" style="font-family:ArialMT,Arial;font-size:18px;fill:#666" text-anchor="middle">
      higher concentrations needed to provoke T-cell–mediated reactions at 24–48 hr
    </text></g></svg>