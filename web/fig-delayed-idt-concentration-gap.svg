<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-idt-concentration-gap_svg1" viewBox="0 0 1090 411.992"><defs id="fig-delayed-idt-concentration-gap_defs1"><style id="fig-delayed-idt-concentration-gap_style1">.fig-delayed-idt-concentration-gap_col-header{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#4c86c5}.fig-delayed-idt-concentration-gap_col-sub{font-family:ArialMT,Arial;font-size:17px;fill:#999}.fig-delayed-idt-concentration-gap_row-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:20px;fill:#212529}.fig-delayed-idt-concentration-gap_row-desc{font-family:ArialMT,Arial;font-size:17px;fill:#666}.fig-delayed-idt-concentration-gap_morph-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:18px;fill:#212529}.fig-delayed-idt-concentration-gap_arrow-label,.fig-delayed-idt-concentration-gap_morph-desc{font-family:ArialMT,Arial;fill:#999}.fig-delayed-idt-concentration-gap_morph-desc{font-size:16px;font-style:italic}.fig-delayed-idt-concentration-gap_arrow-label{font-size:17px}.fig-delayed-idt-concentration-gap_result-desc{font-family:ArialMT,Arial;font-size:18px}.fig-delayed-idt-concentration-gap_skin-bg{fill:#d0c4b5}.fig-delayed-idt-concentration-gap_arrow-line{fill:none;stroke:#bbb;stroke-width:1.5}.fig-delayed-idt-concentration-gap_arrow-head{fill:#bbb}</style></defs><g id="fig-delayed-idt-concentration-gap_layer1" transform="translate(-55 -74.188)"><text id="fig-delayed-idt-concentration-gap_text3" x="410" y="90" class="fig-delayed-idt-concentration-gap_col-header" text-anchor="middle">15–20 min</text><text id="fig-delayed-idt-concentration-gap_text4" x="410" y="110" class="fig-delayed-idt-concentration-gap_col-sub" text-anchor="middle">Immediate read</text><rect id="fig-delayed-idt-concentration-gap_rect7" width="1090" height="170" x="55" y="125" rx="8" style="fill:#f8f9fa"/><text id="fig-delayed-idt-concentration-gap_text8" x="70" y="200" class="fig-delayed-idt-concentration-gap_row-label" text-anchor="start">Standard</text><text id="fig-delayed-idt-concentration-gap_text9" x="70" y="222" class="fig-delayed-idt-concentration-gap_row-label" text-anchor="start">IDT conc.</text><text id="fig-delayed-idt-concentration-gap_text10" x="70" y="244" class="fig-delayed-idt-concentration-gap_row-desc" text-anchor="start">Non-irritating</text><text id="fig-delayed-idt-concentration-gap_text11" x="70" y="262" class="fig-delayed-idt-concentration-gap_row-desc" text-anchor="start">(IgE-optimized)</text><circle id="fig-delayed-idt-concentration-gap_circle11" cx="410" cy="210" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><text id="fig-delayed-idt-concentration-gap_text13" x="410" y="280" class="fig-delayed-idt-concentration-gap_morph-label" text-anchor="middle">No wheal/flare</text><text id="fig-delayed-idt-concentration-gap_text14" x="410" y="298" class="fig-delayed-idt-concentration-gap_morph-desc" text-anchor="middle">e.g. vancomycin via MRGPRX2</text><path id="fig-delayed-idt-concentration-gap_line14" d="M520 210h120" class="fig-delayed-idt-concentration-gap_arrow-line"/><path id="fig-delayed-idt-concentration-gap_polygon14" d="m652 210-12-5v10z" class="fig-delayed-idt-concentration-gap_arrow-head"/><path id="fig-delayed-idt-concentration-gap_line20" d="M55 310h1090" style="fill:none;stroke:#e67e22;stroke-width:2;stroke-dasharray:8 5"/></g><g id="fig-delayed-idt-concentration-gap_layer2" transform="translate(-55 -74.188)"><text id="fig-delayed-idt-concentration-gap_text5" x="790" y="90" class="fig-delayed-idt-concentration-gap_col-header" text-anchor="middle">24–48 hr</text><text id="fig-delayed-idt-concentration-gap_text6" x="790" y="110" class="fig-delayed-idt-concentration-gap_col-sub" text-anchor="middle">Delayed read</text><circle id="fig-delayed-idt-concentration-gap_circle15" cx="790" cy="210" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><circle id="fig-delayed-idt-concentration-gap_circle16" cx="790" cy="210" r="22" style="fill:none;stroke:#a89888;stroke-width:1.5;stroke-dasharray:4 3"/><circle id="fig-delayed-idt-concentration-gap_circle17" cx="790" cy="210" r="3" style="fill:#a89888"/><text id="fig-delayed-idt-concentration-gap_text17" x="790" y="280" class="fig-delayed-idt-concentration-gap_morph-label" text-anchor="middle">Flat — no reaction</text><text id="fig-delayed-idt-concentration-gap_text18" x="960" y="200" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:24px;fill:#000" text-anchor="start">(−)</text><text id="fig-delayed-idt-concentration-gap_text19" x="960" y="224" fill="#2d6a4f" class="fig-delayed-idt-concentration-gap_result-desc" style="fill:#000" text-anchor="start">Delayed</text><text id="fig-delayed-idt-concentration-gap_text20" x="960" y="244" fill="#2d6a4f" class="fig-delayed-idt-concentration-gap_result-desc" style="fill:#000" text-anchor="start">missed</text></g><g id="fig-delayed-idt-concentration-gap_layer3" transform="translate(-55 -74.188)"><text id="fig-delayed-idt-concentration-gap_text23" x="70" y="385" class="fig-delayed-idt-concentration-gap_row-label" text-anchor="start">Higher</text><text id="fig-delayed-idt-concentration-gap_text24" x="70" y="407" class="fig-delayed-idt-concentration-gap_row-label" text-anchor="start">conc.</text><text id="fig-delayed-idt-concentration-gap_text25" x="70" y="429" class="fig-delayed-idt-concentration-gap_row-desc" text-anchor="start">Needed for</text><text id="fig-delayed-idt-concentration-gap_text26" x="70" y="447" class="fig-delayed-idt-concentration-gap_row-desc" text-anchor="start">delayed detection</text><circle id="fig-delayed-idt-concentration-gap_circle26" cx="410" cy="395" r="50" class="fig-delayed-idt-concentration-gap_skin-bg"/><circle id="fig-delayed-idt-concentration-gap_circle27" cx="410" cy="395" r="42" opacity=".25" style="fill:#e74c3c"/><circle id="fig-delayed-idt-concentration-gap_circle28" cx="410" cy="395" r="26" style="fill:#fab1a0;stroke:#c0392b;stroke-width:1.5"/><text id="fig-delayed-idt-concentration-gap_text28