<svg xmlns="http://www.w3.org/2000/svg" id="fig-hla-causality-adjudication_svg1" viewBox="0 0 1100 420"><defs><style>.fig-hla-causality-adjudication_card-bg{fill:none;stroke:#ddd;stroke-width:1.5}.fig-hla-causality-adjudication_header-text{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:24px;fill:#fff}.fig-hla-causality-adjudication_scenario{font-family:ArialMT,Arial;font-size:19px;fill:#666}.fig-hla-causality-adjudication_drug-name{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#212529}.fig-hla-causality-adjudication_assoc{font-family:ArialMT,Arial}.fig-hla-causality-adjudication_drug-dim{font-family:ArialMT,Arial;font-size:22px;fill:#ccc}.fig-hla-causality-adjudication_assoc{font-size:17px;fill:#4c86c5}.fig-hla-causality-adjudication_bullet{fill:#999}</style></defs><g id="fig-hla-causality-adjudication_layer1"><rect width="490" height="420" class="fig-hla-causality-adjudication_card-bg" rx="12"/><path d="M12 0h466q12 0 12 12v44H0V12Q0 0 12 0" style="fill:#666"/><circle cx="36" cy="28" r="15" fill="none" stroke="#fff" stroke-width="2.5"/><text x="36" y="35" fill="#fff" font-family="Arial-BoldMT, Arial" font-size="22" font-weight="700" text-anchor="middle">?</text><text x="62" y="36" class="fig-hla-causality-adjudication_header-text">Multiple Suspects</text><text x="40" y="90" class="fig-hla-causality-adjudication_scenario">Patient with DRESS on concurrent</text><text x="40" y="112" class="fig-hla-causality-adjudication_scenario">antibiotics</text><circle cx="55" cy="158" r="5" class="fig-hla-causality-adjudication_bullet"/><text x="72" y="165" class="fig-hla-causality-adjudication_drug-name">Piperacillin-tazobactam</text><circle cx="55" cy="208" r="5" class="fig-hla-causality-adjudication_bullet"/><text x="72" y="215" class="fig-hla-causality-adjudication_drug-name">Vancomycin</text><circle cx="55" cy="258" r="5" class="fig-hla-causality-adjudication_bullet"/><text x="72" y="265" class="fig-hla-causality-adjudication_drug-name">Cefepime</text><circle cx="55" cy="308" r="5" class="fig-hla-causality-adjudication_bullet"/><text x="72" y="315" class="fig-hla-causality-adjudication_drug-name">Metronidazole</text><text x="245" y="390" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:20px;fill:#999" text-anchor="middle">Which drug caused it?</text></g><g id="fig-hla-causality-adjudication_layer2"><rect width="550" height="420" x="550" class="fig-hla-causality-adjudication_card-bg" rx="12"/><path d="M562 0h526q12 0 12 12v44H550V12q0-12 12-12" style="fill:#4c86c5"/><path stroke="#fff" stroke-width="2.5" d="M572 14v28m14-28v28"/><path stroke="#fff" stroke-width="1.5" d="M572 20h14m-14 8h14m-14 8h14"/><text x="600" y="36" class="fig-hla-causality-adjudication_header-text">HLA-A*32:01 Positive</text><text x="590" y="90" class="fig-hla-causality-adjudication_scenario">HLA result narrows causality:</text><text x="590" y="165" class="fig-hla-causality-adjudication_drug-dim">Piperacillin-tazobactam</text><rect width="510" height="40" x="575" y="188" fill="#c0392b" opacity=".08" rx="6"/><text x="590" y="215" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#c0392b">▸ Vancomycin</text><text x="770" y="215" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:18px;fill:#c0392b">— Most probable culprit</text><text x="590" y="265" class="fig-hla-causality-adjudication_drug-dim">Cefepime</text><text x="590" y="315" class="fig-hla-causality-adjudication_drug-dim">Metronidazole</text><text x="590" y="358" class="fig-hla-causality-adjudication_assoc">HLA-A*32:01 strongly associated with</text><text x="590" y="378" class="fig-hla-causality-adjudication_assoc">vancomycin-induced DRESS</text><text x="825" y="410" style="font-family:ArialMT,Arial;font-size:17px;fill:#999" text-anchor="middle">Low population PPV → high clinical utility for adjudication</text></g></svg>