<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-concomitant-meds_svg1" viewBox="0 0 1100 350"><defs><style>.fig-delayed-concomitant-meds_card-bg{fill:none;stroke:#ddd;stroke-width:1.5}.fig-delayed-concomitant-meds_header-text,.fig-delayed-concomitant-meds_med-name{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:24px;fill:#fff}.fig-delayed-concomitant-meds_med-name{fill:#212529}.fig-delayed-concomitant-meds_detail{font-family:ArialMT,Arial;font-size:20px;fill:#555}.fig-delayed-concomitant-meds_note{font-family:ArialMT,Arial;font-size:18px;fill:#666}.fig-delayed-concomitant-meds_bullet-continue{fill:#2d6a4f}</style></defs><g id="fig-delayed-concomitant-meds_layer1"><rect width="490" height="350" class="fig-delayed-concomitant-meds_card-bg" rx="12"/><path d="M12 0h466q12 0 12 12v44H0V12Q0 0 12 0" style="fill:#2d6a4f"/><circle cx="36" cy="28" r="15" fill="none" stroke="#fff" stroke-width="2.5"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m28 28 6 6 11-12"/><text x="62" y="36" class="fig-delayed-concomitant-meds_header-text">Okay to Continue</text><circle cx="40" cy="126" r="6" class="fig-delayed-concomitant-meds_bullet-continue"/><text x="62" y="134" class="fig-delayed-concomitant-meds_med-name">Antihistamines</text><circle cx="40" cy="200" r="6" class="fig-delayed-concomitant-meds_bullet-continue"/><text x="62" y="208" class="fig-delayed-concomitant-meds_med-name">Beta-blockers</text><text x="40" y="316" class="fig-delayed-concomitant-meds_note">No effect on T-cell–mediated reactions</text></g><g id="fig-delayed-concomitant-meds_layer2"><rect width="550" height="350" x="550" class="fig-delayed-concomitant-meds_card-bg" rx="12"/><path d="M562 0h526q12 0 12 12v44H550V12q0-12 12-12" style="fill:#e67e22"/><path fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="2.5" d="m586 14-14 28h28Z"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.5" d="M586 24v10"/><circle cx="586" cy="38" r="1.5" fill="#fff"/><text x="612" y="36" class="fig-delayed-concomitant-meds_header-text">Must Hold or Reduce</text><circle cx="590" cy="118" r="6" style="fill:#e67e22"/><text x="612" y="126" class="fig-delayed-concomitant-meds_med-name">Systemic Steroids</text><text x="612" y="178" class="fig-delayed-concomitant-meds_detail">Off ≥ 1 month</text><text x="612" y="212" style="font-family:ArialMT,Arial;font-size:18px;fill:#999">— or —</text><text x="612" y="248" class="fig-delayed-concomitant-meds_detail">Prednisone equivalent</text><text x="612" y="276" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#e67e22">≤ 10 mg/day</text><text x="590" y="328" class="fig-delayed-concomitant-meds_note">Suppresses T-cell–mediated responses</text></g></svg>