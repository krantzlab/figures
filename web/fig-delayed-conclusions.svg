<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-conclusions_svg1" viewBox="0 0 1100 300"><defs><style>.fig-delayed-conclusions_card-bg{fill:none;stroke:#ddd;stroke-width:1.5}.fig-delayed-conclusions_header-text{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#fff}.fig-delayed-conclusions_body-em{font-size:20px;fill:#212529}.fig-delayed-conclusions_body-text{font-family:ArialMT,Arial;font-size:20px;fill:#212529}.fig-delayed-conclusions_body-em{font-family:Arial-BoldMT,Arial;font-weight:700}</style></defs><g id="fig-delayed-conclusions_layer1"><rect width="340" height="300" class="fig-delayed-conclusions_card-bg" rx="12"/><path d="M12 0h316q12 0 12 12v44H0V12Q0 0 12 0" style="fill:#2d6a4f"/><text x="170" y="36" class="fig-delayed-conclusions_header-text" text-anchor="middle">Valuable but Limited</text><text x="170" y="110" class="fig-delayed-conclusions_body-text" text-anchor="middle">Delayed testing aids</text><text x="170" y="140" class="fig-delayed-conclusions_body-em" text-anchor="middle">diagnosis, causality,</text><text x="170" y="170" class="fig-delayed-conclusions_body-em" text-anchor="middle">and risk stratification</text><text x="170" y="220" class="fig-delayed-conclusions_body-text" text-anchor="middle">but no test achieves</text><text x="170" y="250" class="fig-delayed-conclusions_body-text" text-anchor="middle">100% sensitivity or NPV</text></g><g id="fig-delayed-conclusions_layer2"><rect width="340" height="300" x="380" class="fig-delayed-conclusions_card-bg" rx="12"/><path d="M392 0h316q12 0 12 12v44H380V12q0-12 12-12" style="fill:#e67e22"/><text x="550" y="36" class="fig-delayed-conclusions_header-text" text-anchor="middle">Sensitivity Varies</text><text x="550" y="120" class="fig-delayed-conclusions_body-text" text-anchor="middle">Depends on</text><text x="550" y="160" class="fig-delayed-conclusions_body-em" text-anchor="middle">modality</text><text x="550" y="200" class="fig-delayed-conclusions_body-em" text-anchor="middle">phenotype</text><text x="550" y="240" class="fig-delayed-conclusions_body-em" text-anchor="middle">timing from reaction</text></g><g id="fig-delayed-conclusions_layer3"><rect width="340" height="300" x="760" class="fig-delayed-conclusions_card-bg" rx="12"/><path d="M772 0h316q12 0 12 12v44H760V12q0-12 12-12" style="fill:#c0392b"/><text x="930" y="36" class="fig-delayed-conclusions_header-text" text-anchor="middle">Unmet Need</text><text x="930" y="120" class="fig-delayed-conclusions_body-text" text-anchor="middle">Skin test concentrations</text><text x="930" y="150" class="fig-delayed-conclusions_body-text" text-anchor="middle">for delayed reactions</text><text x="930" y="200" class="fig-delayed-conclusions_body-text" text-anchor="middle">need to be</text><text x="930" y="240" class="fig-delayed-conclusions_body-em" text-anchor="middle">validated and standardized</text></g></svg>