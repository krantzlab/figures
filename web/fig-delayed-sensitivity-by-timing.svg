<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-sensitivity-by-timing_svg1" viewBox="0 0 1100 550"><defs><style>.fig-delayed-sensitivity-by-timing_col-header,.fig-delayed-sensitivity-by-timing_row-label{font-family:Arial-BoldMT,Arial;font-weight:700}.fig-delayed-sensitivity-by-timing_col-header{font-size:20px;fill:#212529}.fig-delayed-sensitivity-by-timing_row-label{font-size:22px}.fig-delayed-sensitivity-by-timing_row-desc{font-family:ArialMT,Arial;font-size:17px;fill:#666}.fig-delayed-sensitivity-by-timing_pct{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:17px}.fig-delayed-sensitivity-by-timing_cell-note{font-family:ArialMT,Arial}.fig-delayed-sensitivity-by-timing_note{font-family:ArialMT,Arial;font-size:18px;fill:#666}.fig-delayed-sensitivity-by-timing_cell-note{font-size:14px;fill:#999;font-style:italic}.fig-delayed-sensitivity-by-timing_row-bg{fill:#f8f9fa}</style></defs><g id="fig-delayed-sensitivity-by-timing_layer1"><text x="550" y="30" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:26px;fill:#212529" text-anchor="middle">Delayed Hypersensitivity Test Sensitivity by Timing</text><text x="550" y="56" style="font-family:ArialMT,Arial;font-size:20px;fill:#666" text-anchor="middle">Approximate sensitivity ranges by time from index drug reaction</text><text x="310" y="95" class="fig-delayed-sensitivity-by-timing_col-header" text-anchor="middle">&lt; 6 weeks</text><text x="515" y="95" class="fig-delayed-sensitivity-by-timing_col-header" text-anchor="middle">6 wk – 6 mo</text><text x="720" y="95" class="fig-delayed-sensitivity-by-timing_col-header" text-anchor="middle">6 mo – 1 yr</text><text x="925" y="95" class="fig-delayed-sensitivity-by-timing_col-header" text-anchor="middle">&gt; 1 year</text><path d="M420 108v10h190v-10" style="fill:none;stroke:#2d6a4f;stroke-width:2"/><text x="515" y="138" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:18px;fill:#2d6a4f" text-anchor="middle">Optimal window</text><path d="M210 80v365M415 80v365M620 80v365M825 80v365m205-365v365" style="fill:none;stroke:#e0e0e0;stroke-width:1"/><rect width="1065" height="86" x="12" y="152" class="fig-delayed-sensitivity-by-timing_row-bg" rx="6"/><rect width="1065" height="86" x="12" y="352" class="fig-delayed-sensitivity-by-timing_row-bg" rx="6"/><text x="20" y="195" fill="#e67e22" class="fig-delayed-sensitivity-by-timing_row-label">Patch Test</text><text x="20" y="214" class="fig-delayed-sensitivity-by-timing_row-desc">Epicutaneous</text><text x="20" y="295" fill="#4c86c5" class="fig-delayed-sensitivity-by-timing_row-label">Delayed IDT</text><text x="20" y="314" class="fig-delayed-sensitivity-by-timing_row-desc">Intradermal</text><text x="20" y="395" fill="#8e44ad" class="fig-delayed-sensitivity-by-timing_row-label">ELISpot / LTT</text><text x="20" y="414" class="fig-delayed-sensitivity-by-timing_row-desc">In vitro T-cell</text></g><g id="fig-delayed-sensitivity-by-timing_layer2"><rect width="74" height="26" x="273" y="178" fill="#e67e22" opacity=".4" rx="4"/><text x="310" y="218" fill="#e67e22" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">~30–40%</text><text x="310" y="232" class="fig-delayed-sensitivity-by-timing_cell-note" text-anchor="middle">May be too early</text><rect width="100" height="26" x="465" y="178" fill="#e67e22" rx="4"/><text x="515" y="218" fill="#e67e22" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">40–55%</text><rect width="80" height="26" x="680" y="178" fill="#e67e22" opacity=".65" rx="4"/><text x="720" y="218" fill="#e67e22" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">30–45%</text><rect width="55" height="26" x="898" y="178" fill="#e67e22" opacity=".35" rx="4"/><text x="925" y="218" fill="#e67e22" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">≤30%</text><rect width="95" height="26" x="262" y="278" fill="#4c86c5" opacity=".5" rx="4"/><text x="310" y="318" fill="#4c86c5" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">~40–50%</text><text x="310" y="332" class="fig-delayed-sensitivity-by-timing_cell-note" text-anchor="middle">May be too early</text><rect width="140" height="26" x="445" y="278" fill="#4c86c5" rx="4"/><text x="515" y="318" fill="#4c86c5" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">60–70%</text><rect width="115" height="26" x="662" y="278" fill="#4c86c5" opacity=".7" rx="4"/><text x="720" y="318" fill="#4c86c5" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">50–60%</text><rect width="75" height="26" x="888" y="278" fill="#4c86c5" opacity=".4" rx="4"/><text x="925" y="318" fill="#4c86c5" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">~30–40%</text><rect width="150" height="26" x="235" y="378" fill="#8e44ad" rx="4"/><text x="310" y="418" fill="#8e44ad" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">60–80%</text><text x="310" y="432" class="fig-delayed-sensitivity-by-timing_cell-note" text-anchor="middle">Best in acute phase</text><rect width="130" height="26" x="450" y="378" fill="#8e44ad" opacity=".85" rx="4"/><text x="515" y="418" fill="#8e44ad" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">55–70%</text><rect width="100" height="26" x="670" y="378" fill="#8e44ad" opacity=".6" rx="4"/><text x="720" y="418" fill="#8e44ad" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">40–55%</text><rect width="75" height="26" x="888" y="378" fill="#8e44ad" opacity=".35" rx="4"/><text x="925" y="418" fill="#8e44ad" class="fig-delayed-sensitivity-by-timing_pct" text-anchor="middle">≤40%</text><path stroke="#e0e0e0" d="M12 460h1065"/><text x="550" y="490" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:18px;fill:#212529" text-anchor="middle">ENDA/EAACI: Skin test 6 weeks – 6 months from reaction when possible</text><text x="550" y="516" class="fig-delayed-sensitivity-by-timing_note" text-anchor="middle">In vitro assays (ELISpot, LTT) can be performed earlier; all modalities decline over time</text><text x="550" y="540" class="fig-delayed-sensitivity-by-timing_note" style="font-style:italic;fill:#999" text-anchor="middle">Ranges approximate — limited formal longitudinal data for delayed-type reactions</text></g></svg>