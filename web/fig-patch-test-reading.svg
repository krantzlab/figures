<svg xmlns="http://www.w3.org/2000/svg" id="fig-patch-test-reading_svg1" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1600 900" width="100%" height="100%"><defs id="fig-patch-test-reading_defs1"><linearGradient id="fig-patch-test-reading_severity-grad" x1="7.971" x2="98.303" y1="812.994" y2="812.994" gradientTransform="matrix(15.05545 0 0 .06642 -8 166)" gradientUnits="userSpaceOnUse"><stop id="fig-patch-test-reading_stop1" offset="0%" stop-color="#2d6a4f"/><stop id="fig-patch-test-reading_stop2" offset="50%" stop-color="#e67e22"/><stop id="fig-patch-test-reading_stop3" offset="100%" stop-color="#c0392b"/></linearGradient><style id="fig-patch-test-reading_style1">.fig-patch-test-reading_text-grade,.fig-patch-test-reading_text-grade-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:36px;fill:#212529}.fig-patch-test-reading_text-grade-label{font-size:22px}.fig-patch-test-reading_text-desc{font-family:ArialMT,Arial;font-size:20px;fill:#212529}.fig-patch-test-reading_text-desc-em{font-size:20px;fill:#212529;font-family:Arial-BoldMT,Arial;font-weight:700}.fig-patch-test-reading_text-small{font-family:ArialMT,Arial;font-size:20px;fill:#666}.fig-patch-test-reading_skin{fill:#d0c4b5}.fig-patch-test-reading_skin-outline{fill:none;stroke:#a89888;stroke-width:2}.fig-patch-test-reading_papule{fill:#c0392b;opacity:.5}.fig-patch-test-reading_bulla{fill:#ffeaa7;stroke:#c0392b}.fig-patch-test-reading_infiltration{stroke:#c0392b}.fig-patch-test-reading_vesicle{fill:#ffeaa7;stroke:#c0392b;stroke-width:1.5}.fig-patch-test-reading_bulla,.fig-patch-test-reading_infiltration{stroke-width:2}.fig-patch-test-reading_infiltration{fill:none;stroke-dasharray:4 3;opacity:.6}.fig-patch-test-reading_divider{fill:none;stroke:#d0d0d0;stroke-width:1}</style></defs><text id="fig-patch-test-reading_text3" x="792" y="206" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#4c86c5" text-anchor="middle">Read at 48h (remove patches), confirm at 72–96h</text><rect id