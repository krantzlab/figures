V600"/><text id="fig-patch-test-reading_text72" x="928" y="695" class="fig-patch-test-reading_text-axis" text-anchor="middle" transform="rotate(-90 928 695)">Intensity</text><path id="fig-patch-test-reading_line73" stroke="#999" stroke-width="1.5" d="M1010 780v6"/><path id="fig-patch-test-reading_line74" stroke="#999" stroke-width="1.5" d="M1180 780v6"/><path id="fig-patch-test-reading_line75" stroke="#999" stroke-width="1.5" d="M1350 780v6"/><text id="fig-patch-test-reading_text75" x="1010" y="800" class="fig-patch-test-reading_text-axis" text-anchor="middle">48h</text><text id="fig-patch-test-reading_text76" x="1180" y="800" class="fig-patch-test-reading_text-axis" text-anchor="middle">72h</text><text id="fig-patch-test-reading_text77" x="1350" y="800" class="fig-patch-test-reading_text-axis" text-anchor="middle">96h</text><path id="fig-patch-test-reading_line77" stroke="#4c86c5" stroke-dasharray="4 3" stroke-width="1" d="M1010 780V608" opacity=".4"/><text id="fig-patch-test-reading_text78" x="1016" y="618" fill="#4c86c5" class="fig-patch-test-reading_text-axis">patches off</text><path id="fig-patch-test-reading_path78" fill="none" stroke="#e67e22" stroke-linecap="round" stroke-width="4" d="M1010 635c60 25 110 63 170 85s120 38 170 48"/><circle id="fig-patch-test-reading_circle78" cx="1010" cy="635" r="7" fill="#e67e22"/><circle id="fig-patch-test-reading_circle79" cx="1180" cy="720" r="7" fill="#e67e22"/><circle id="fig-patch-test-reading_circle80" cx="1350" cy="768" r="7" fill="#e67e22"/><text id="fig-patch-test-reading_text80" x="1028" y="628" fill="#e67e22" class="fig-patch-test-reading_text-curve-sub">strongest</text><text id="fig-patch-test-reading_text81" x="1198" y="714" fill="#e67e22" class="fig-patch-test-reading_text-curve-sub">fading</text><text id="fig-patch-test-reading_text82" x="1368" y="762" fill="#e67e22" class="fig-patch-test-reading_text-curve-sub">resolved</text><path id="fig-patch-test-reading_path82" fill="#e67e22" d="M1010 635c60 25 110 63 170 85s120 38 170 48v12h-340Z" opacity=".07"/><path id="fig-patch-test-reading_line82" stroke="#d0d0d0" stroke-dasharray="4 4" stroke-width="1" d="M800 575v235"/><text id="fig-patch-test-reading_text83" x="800" y="838" class="fig-patch-test-reading_text-small" text-anchor="middle">ICDRG grading. Key distinction: palpable infiltration separates true positive from doubtful/irritant.</text><text id="fig-patch-test-reading_text84" x="800" y="863" class="fig-patch-test-reading_text-small" text-anchor="middle">For drug patch testing: read at 48h, 72h, and 96h (or Day 7). Late positives common with drugs.</text></svg>