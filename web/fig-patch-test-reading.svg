<svg xmlns="http://www.w3.org/2000/svg" id="fig-patch-test-reading_svg1" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1600 900" width="100%" height="100%"><defs id="fig-patch-test-reading_defs1"><linearGradient id="fig-patch-test-reading_severity-grad" x1="0" x2="1" y1="0" y2="0"><stop id="fig-patch-test-reading_stop1" offset="0%" stop-color="#2d6a4f"/><stop id="fig-patch-test-reading_stop2" offset="50%" stop-color="#e67e22"/><stop id="fig-patch-test-reading_stop3" offset="100%" stop-color="#c0392b"/></linearGradient><style id="fig-patch-test-reading_style1">.fig-patch-test-reading_text-grade,.fig-patch-test-reading_text-grade-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:36px;fill:#212529}.fig-patch-test-reading_text-grade-label{font-size:22px}.fig-patch-test-reading_text-desc{font-family:ArialMT,Arial;font-size:20px;fill:#212529}.fig-patch-test-reading_text-desc-em{font-size:20px;fill:#212529;font-family:Arial-BoldMT,Arial;font-weight:700}.fig-patch-test-reading_text-axis{font-family:ArialMT,Arial}.fig-patch-test-reading_text-small{font-family:ArialMT,Arial;font-size:20px;fill:#666}.fig-patch-test-reading_text-axis{font-size:16px;fill:#999}.fig-patch-test-reading_text-curve-label{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:20px}.fig-patch-test-reading_text-curve-sub{font-family:ArialMT,Arial;font-size:16px}.fig-patch-test-reading_skin{fill:#d0c4b5}.fig-patch-test-reading_skin-outline{fill:none;stroke:#a89888;stroke-width:2}.fig-patch-test-reading_papule{fill:#c0392b;opacity:.5}.fig-patch-test-reading_bulla{fill:#ffeaa7;stroke:#c0392b}.fig-patch-test-reading_infiltration{stroke:#c0392b}.fig-patch-test-reading_vesicle{fill:#ffeaa7;stroke:#c0392b;stroke-width:1.5}.fig-patch-test-reading_bulla,.fig-patch-test-reading_infiltration{stroke-width:2}.fig-patch-test-reading_infiltration{fill:none;stroke-dasharray:4 3;opacity:.6}.fig-patch-test-reading_divider{fill:none;stroke:#d0d0d0;stroke-width:1}</style></defs><text id="fig-patch-test-reading_text3" x="800" y="40" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#4c86c5" text-anchor="middle">Read at 48h (remove patches), confirm at 72–96h</text><rect id="fig-patch-test-reading_rect3" width="1360" height="6" x="120" y="54" fill="url(#fig-patch-test-reading_severity-grad)" opacity=".3" rx="3"/><text id="fig-patch-test-reading_text4" x="120" y="78" class="fig-patch-test-reading_text-small" style="font-size:18px" text-anchor="start">No reaction</text><text id="fig-patch-test-reading_text5" x="1480" y="78" class="fig-patch-test-reading_text-small" style="font-size:18px" text-anchor="end">Severe</text><path id="fig-patch-test-reading_line5" d="M368 88v402" class="fig-patch-test-reading_divider"/><path id="fig-patch-test-reading_line6" d="M656 88v402" class="fig-patch-test-reading_divider"/><path id="fig-patch-test-reading_line7" d="M944 88v402" class="fig-patch-test-reading_divider"/><path id="fig-patch-test-reading_line8" d="M1232 88v402" class="fig-patch-test-reading_divider"/><text id="fig-patch-test-reading_text8" x="224" y="118" class="fig-patch-test-reading_text-grade" text-anchor="middle">−</text><text id="fig-patch-test-reading_text9" x="224" y="144" class="fig-patch-test-reading_text-grade-label" text-anchor="middle">Negative</text><circle id="fig-patch-test-reading_circle9" cx="224" cy="262" r="82" class="fig-patch-test-reading_skin"/><circle id="fig-patch-test-reading_circle10" cx="224" cy="262" r="82" class="fig-patch-test-reading_skin-outline"/><circle id="fig-patch-test-reading_circle11" cx="224" cy="262" r="10" fill="none" stroke="#b3b3b3" stroke-dasharray="3 3" stroke-width="1.5"/><text id="fig-patch-test-reading_text11" x="224" y="382" class="fig-patch-test-reading_text-desc" text-anchor="middle">No reaction</text><text id="fig-patch-test-reading_text12" x="512" y="118" class="fig-patch-test-reading_text-grade" text-anchor="middle">?+</text><text id="fig-patch-test-reading_text13" x="512" y="144" class="fig-patch-test-reading_text-grade-label" text-anchor="middle">Doubtful</text><circle id="fig-patch-test-reading_circle13" cx="512" cy="262" r="82" class="fig-patch-test-reading_skin"/><circle id="fig-patch-test-reading_circle14" cx="512" cy="262" r="42" style="fill:#e8c4b8"/><circle id="fig-patch-test-reading_circle15" cx="512" cy="262" r="82" class="fig-patch-test-reading_skin-outline"/><text id="fig-patch-test-reading_text15" x="512" y="382" class="fig-patch-test-reading_text-desc" text-anchor="middle">Faint erythema</text><text id="fig-patch-test-reading_text16" x="512" y="406" class="fig-patch-test-reading_text-desc" text-anchor="middle">No infiltration</text><text id="fig-patch-test-reading_text17" x="800" y="118" class="fig-patch-test-reading_text-grade" text-anchor="middle">+</text><text id="fig-patch-test-reading_text18" x="800" y="144" class="fig-patch-test-reading_text-grade-label" text-anchor="middle">Weak positive</text><circle id="fig-patch-test-reading_circle18" cx="800" cy="262" r="82" class="fig-patch-test-reading_skin"/><circle id="fig-patch-test-reading_circle19" cx="800" cy="262" r="52" style="fill:#fab1a0"/><circle id="fig-patch-test-reading_circle20" cx="800" cy="262" r="36" class="fig-patch-test-reading_infiltration"/><circle id="fig-patch-test-reading_circle21" cx="790" cy="252" r="4" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle22" cx="810" cy="267" r="3.5" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle23" cx="796" cy="278" r="3.5" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle24" cx="800" cy="262" r="82" class="fig-patch-test-reading_skin-outline"/><text id="fig-patch-test-reading_text24" x="800" y="382" class="fig-patch-test-reading_text-desc" text-anchor="middle">Erythema</text><text id="fig-patch-test-reading_text25" x="800" y="406" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Infiltration</text><text id="fig-patch-test-reading_text26" x="800" y="430" class="fig-patch-test-reading_text-desc" text-anchor="middle">± papules</text><text id="fig-patch-test-reading_text27" x="1088" y="118" class="fig-patch-test-reading_text-grade" text-anchor="middle">++</text><text id="fig-patch-test-reading_text28" x="1088" y="144" class="fig-patch-test-reading_text-grade-label" text-anchor="middle">Strong positive</text><circle id="fig-patch-test-reading_circle28" cx="1088" cy="262" r="82" class="fig-patch-test-reading_skin"/><circle id="fig-patch-test-reading_circle29" cx="1088" cy="262" r="62" style="fill:#f08070"/><circle id="fig-patch-test-reading_circle30" cx="1088" cy="262" r="45" class="fig-patch-test-reading_infiltration"/><circle id="fig-patch-test-reading_circle31" cx="1074" cy="248" r="5" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle32" cx="1100" cy="255" r="4.5" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle33" cx="1082" cy="280" r="4" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle34" cx="1102" cy="275" r="5" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle35" cx="1072" cy="269" r="4.5" class="fig-patch-test-reading_papule"/><circle id="fig-patch-test-reading_circle36" cx="1090" cy="259" r="6" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle37" cx="1078" cy="265" r="4.5" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle38" cx="1098" cy="278" r="5" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle39" cx="1088" cy="262" r="82" class="fig-patch-test-reading_skin-outline"/><text id="fig-patch-test-reading_text39" x="1088" y="382" class="fig-patch-test-reading_text-desc" text-anchor="middle">Erythema, infiltration</text><text id="fig-patch-test-reading_text40" x="1088" y="406" class="fig-patch-test-reading_text-desc" text-anchor="middle">Papules</text><text id="fig-patch-test-reading_text41" x="1088" y="430" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Vesicles</text><text id="fig-patch-test-reading_text42" x="1376" y="118" class="fig-patch-test-reading_text-grade" text-anchor="middle">+++</text><text id="fig-patch-test-reading_text43" x="1376" y="144" class="fig-patch-test-reading_text-grade-label" text-anchor="middle">Extreme</text><circle id="fig-patch-test-reading_circle43" cx="1376" cy="262" r="82" class="fig-patch-test-reading_skin"/><circle id="fig-patch-test-reading_circle44" cx="1376" cy="262" r="72" style="fill:#e74c3c"/><ellipse id="fig-patch-test-reading_ellipse44" cx="1376" cy="255" class="fig-patch-test-reading_bulla" rx="26" ry="20"/><ellipse id="fig-patch-test-reading_ellipse45" cx="1362" cy="278" class="fig-patch-test-reading_bulla" rx="16" ry="13"/><ellipse id="fig-patch-test-reading_ellipse46" cx="1394" cy="276" class="fig-patch-test-reading_bulla" rx="14" ry="11"/><circle id="fig-patch-test-reading_circle46" cx="1350" cy="246" r="5" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle47" cx="1402" cy="250" r="4.5" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle48" cx="1348" cy="282" r="4.5" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle49" cx="1404" cy="280" r="5" class="fig-patch-test-reading_vesicle"/><circle id="fig-patch-test-reading_circle50" cx="1376" cy="262" r="82" class="fig-patch-test-reading_skin-outline"/><text id="fig-patch-test-reading_text50" x="1376" y="382" class="fig-patch-test-reading_text-desc" text-anchor="middle">Intense erythema</text><text id="fig-patch-test-reading_text51" x="1376" y="406" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Coalescing vesicles</text><text id="fig-patch-test-reading_text52" x="1376" y="430" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">or bullous</text><path id="fig-patch-test-reading_line52" stroke="#b3b3b3" stroke-width="1" d="M80 460h1440"/><rect id="fig-patch-test-reading_rect52" width="160" height="34" x="100" y="472" fill="#ccddec" stroke="#a0b8cc" stroke-width="2" rx="6"/><text id="fig-patch-test-reading_text53" x="180" y="495" fill="#2d6a4f" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Non-allergic</text><text id="fig-patch-test-reading_text54" x="275" y="495" class="fig-patch-test-reading_text-desc">− and ?+</text><rect id="fig-patch-test-reading_rect54" width="130" height="34" x="460" y="472" fill="#fab1a0" stroke="#c0392b" stroke-width="2" rx="6"/><text id="fig-patch-test-reading_text55" x="525" y="495" fill="#c0392b" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Allergic</text><text id="fig-patch-test-reading_text56" x="605" y="495" class="fig-patch-test-reading_text-desc">+, ++, +++ — requires</text><text id="fig-patch-test-reading_text57" x="828" y="495" class="fig-patch-test-reading_text-desc-em">palpable infiltration</text><path id="fig-patch-test-reading_line57" stroke="#b3b3b3" stroke-width="1" d="M80 525h1440"/><text id="fig-patch-test-reading_text58" x="800" y="555" class="fig-patch-test-reading_text-grade-label" text-anchor="middle">Temporal Pattern: Distinguishing True Allergy from Irritant</text><text id="fig-patch-test-reading_text59" x="410" y="588" fill="#2d6a4f" class="fig-patch-test-reading_text-curve-label" text-anchor="middle">True Allergic — Crescendo ↗</text><path id="fig-patch-test-reading_line59" stroke="#999" stroke-width="1.5" d="M170 780h480"/><path id="fig-patch-test-reading_line60" stroke="#999" stroke-width="1.5" d="M170 780V600"/><text id="fig-patch-test-reading_text60" x="148" y="695" class="fig-patch-test-reading_text-axis" text-anchor="middle" transform="rotate(-90 148 695)">Intensity</text><path id="fig-patch-test-reading_line61" stroke="#999" stroke-width="1.5" d="M230 780v6"/><path id="fig-patch-test-reading_line62" stroke="#999" stroke-width="1.5" d="M400 780v6"/><path id="fig-patch-t