 stroke="#a0b8cc" stroke-width="2" rx="6"/><text id="fig-patch-test-reading_text53" x="172" y="661" fill="#2d6a4f" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Non-allergic</text><text id="fig-patch-test-reading_text54" x="267" y="661" class="fig-patch-test-reading_text-desc">− and ?+</text><rect id="fig-patch-test-reading_rect54" width="130" height="34" x="452" y="638" fill="#fab1a0" stroke="#c0392b" stroke-width="2" rx="6"/><text id="fig-patch-test-reading_text55" x="517" y="661" fill="#c0392b" class="fig-patch-test-reading_text-desc-em" text-anchor="middle">Allergic</text><text id="fig-patch-test-reading_text56" x="597" y="661" class="fig-patch-test-reading_text-desc">+, ++, +++ — requires</text><text id="fig-patch-test-reading_text57" x="820" y="661" class="fig-patch-test-reading_text-desc-em">palpable infiltration</text><path id="fig-patch-test-reading_line57" stroke="#b3b3b3" stroke-width="1" d="M72 691h1440"/></svg>