<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-idt-reading_svg1" viewBox="0 0 1600 900"><defs id="fig-delayed-idt-reading_defs1"><style id="fig-delayed-idt-reading_style1">.fig-delayed-idt-reading_text-heading{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:24px;fill:#212529}.fig-delayed-idt-reading_text-label{font-family:ArialMT,Arial;font-size:20px;fill:#212529}.fig-delayed-idt-reading_text-result{font-family:Arial-BoldMT,Arial;font-weight:700;font-size:28px}.fig-delayed-idt-reading_text-small{font-family:ArialMT,Arial;font-size:18px;fill:#666}.fig-delayed-idt-reading_skin{fill:#d0c4b5;stroke:#000;stroke-width:3;stroke-miterlimit:10}</style></defs><text id="fig-delayed-idt-reading_text2" x="800" y="85" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#4c86c5" text-anchor="middle">Read at 24 hours and 48 hours</text><path id="fig-delayed-idt-reading_line2" d="M800 110v590" style="fill:none;stroke:#b3b3b3;stroke-width:2;stroke-dasharray:6 6;stroke-miterlimit:10"/><text id="fig-delayed-idt-reading_text3" x="400" y="140" class="fig-delayed-idt-reading_text-heading" text-anchor="middle">Negative (−)</text><rect id="fig-delayed-idt-reading_rect3" width="400" height="300" x="200" y="180" class="fig-delayed-idt-reading_skin" rx="12"/><circle id="fig-delayed-idt-reading_circle3" cx="400" cy="330" r="30" style="fill:#d0c4b5;stroke:#b3b3b3;stroke-width:2;stroke-dasharray:3 3"/><text id="fig-delayed-idt-reading_text4" x="400" y="335" class="fig-delayed-idt-reading_text-small" text-anchor="middle">injection</text><text id="fig-delayed-idt-reading_text5" x="400" y="355" class="fig-delayed-idt-reading_text-small" text-anchor="middle">site</text><text id="fig-delayed-idt-reading_text6" x="400" y="530" class="fig-delayed-idt-reading_text-label" text-anchor="middle">No papule</text><rect id="fig-delayed-idt-reading_rect7" width="300" height="60" x="250" y="600" fill="#ccddec" stroke="#000" stroke-width="3" rx="8"/><text id="fig-delayed-idt-reading_text8" x="400" y="638" fill="#2d6a4f" class="fig-delayed-idt-reading_text-result" text-anchor="middle">NEGATIVE</text><text id="fig-delayed-idt-reading_text9" x="1200" y="140" class="fig-delayed-idt-reading_text-heading" text-anchor="middle">Positive (+)</text><rect id="fig-delayed-idt-reading_rect9" width="400" height="300" x="1000" y="180" class="fig-delayed-idt-reading_skin" rx="12"/><circle id="fig-delayed-idt-reading_circle9" cx="1200" cy="330" r="55" style="fill:#e74c3c;opacity:.4"/><circle id="fig-delayed-idt-reading_circle10" cx="1200" cy="330" r="40" style="fill:#fab1a0;stroke:#c0392b;stroke-width:3"/><text id="fig-delayed-idt-reading_text15" x="1200" y="530" class="fig-delayed-idt-reading_text-label" text-anchor="middle">Papule present</text><rect id="fig-delayed-idt-reading_rect16" width="300" height="60" x="1050" y="600" fill="#fab1a0" stroke="#000" stroke-width="3" rx="8"/><text id="fig-delayed-idt-reading_text17" x="1200" y="638" fill="#c0392b" class="fig-delayed-idt-reading_text-result" text-anchor="middle">POSITIVE</text></svg>