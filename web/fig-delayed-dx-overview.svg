<svg xmlns="http://www.w3.org/2000/svg" id="fig-delayed-dx-overview_svg1" viewBox="0 0 960 410"><defs><style>.fig-delayed-dx-overview_test-name,.fig-delayed-dx-overview_val{font-family:Arial-BoldMT,Arial;font-weight:700}.fig-delayed-dx-overview_test-name{font-size:26px;fill:#212529}.fig-delayed-dx-overview_val{font-size:30px}.fig-delayed-dx-overview_tick{font-family:ArialMT,Arial;font-size:18px;fill:#212529}</style></defs><g id="fig-delayed-dx-overview_layer1"><path stroke="#e8e8e8" d="M280 55v260M580 55v260M880 55v260"/><text x="280" y="342" class="fig-delayed-dx-overview_tick" text-anchor="middle">0%</text><text x="580" y="342" class="fig-delayed-dx-overview_tick" text-anchor="middle">50%</text><text x="880" y="342" class="fig-delayed-dx-overview_tick" text-anchor="middle">100%</text><text x="580" y="374" style="font-family:Arial-BoldMT,Arial;font-weight:700;font-size:22px;fill:#212529" text-anchor="middle">Sensitivity</text><text x="260" y="105" class="fig-delayed-dx-overview_test-name" text-anchor="end">Patch Testing</text><rect width="90" height="36" x="520" y="82" fill="#4c86c5" rx="18"/><text x="624" y="108" fill="#4c86c5" class="fig-delayed-dx-overview_val">40–55%</text></g><g id="fig-delayed-dx-overview_layer2"><text x="260" y="205" class="fig-delayed-dx-overview_test-name" text-anchor="end">Delayed IDT</text><rect width="60" height="36" x="640" y="182" fill="#2d6a4f" rx="18"/><text x="714" y="208" fill="#2d6a4f" class="fig-delayed-dx-overview_val">60–70%</text></g><g id="fig-delayed-dx-overview_layer3"><text x="260" y="305" class="fig-delayed-dx-overview_test-name" text-anchor="end">ELISpot</text><rect width="90" height="36" x="640" y="282" fill="#8e44ad" rx="18"/><text x="744" y="308" fill="#8e44ad" class="fig-delayed-dx-overview_val">60–75%</text><text x="580" y="404" style="font-family:ArialMT,Arial;font-size:18px;fill:#666" text-anchor="middle">All tests: specificity ≥95%</text></g></svg>