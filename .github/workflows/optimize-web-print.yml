name: Generate Optimized Figures and Images (Web & Print)

on:
  push:
    paths:
      - 'source-svg/**.svg'
      - 'svgo.config.js'
      - 'source-people/**'
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      # --- SETUP TOOLS ---
      - name: Install Node & SVGO
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g svgo

      # --- Install Graphics Tools ---
      - name: Install Graphics Tools (Inkscape & WebP)
        run: |
          sudo apt-get update
          # Install both at once to save time
          sudo apt-get install -y --no-install-recommends inkscape webp

      # --- CACHE rembg MODEL (avoids re-downloading the ~200MB model every run) ---
      - name: Cache rembg Model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-birefnet-portrait-v1

      # --- INSTALL rembg + Pillow (background removal for headshots) ---
      - name: Install rembg
        run: |
          python3 -m pip install --user "rembg[cpu]" Pillow

      # --- PREPARE FOLDERS ---
      - name: Create Web and Print Directories
        run: |
          mkdir -p dist/web
          mkdir -p dist/print

      # --- GENERATE WEB ASSETS (Optimized SVG with Unique IDs) ---
      - name: Generate Web Assets
        run: |
          # Loop through every SVG file in the source folder
          for file in source-svg/*.svg; do
            # 1. Get the filename without extension (e.g. "fig-hla")
            filename=$(basename "$file" .svg)

            echo "Optimizing $filename..."

            # 2. Run SVGO
            # We pass SVG_FILENAME as an environment variable so svgo.config.js can read it.
            # We explicitly point to your config file.
            SVG_FILENAME="$filename" svgo -i "$file" -o "dist/web/$(basename "$file")" --config=svgo.config.js
          done

      # --- GENERATE PRINT ASSETS (PDF) ---
      - name: Generate Print Assets
        # Converts SVGs to high-res PDF for manuscripts
        run: |
          for file in source-svg/*.svg; do
            filename=$(basename "$file" .svg)
            echo "Converting $filename to PDF..."
            inkscape "$file" --export-filename="dist/print/$filename.pdf"
          done

      # --- PROCESS PEOPLE (Background Removal -> Transparent WebP) ---
      - name: Process Headshots
        # 1. rembg strips the background using birefnet-portrait (handles hair + glasses well)
        # 2. cwebp resizes to 600x600 and encodes WebP preserving the alpha channel
        # Transparent output adapts to both light and dark mode cards on the site
        run: |
          mkdir -p /tmp/headshots
          shopt -s nullglob
          for file in source-people/*.{jpg,jpeg,png,JPG,JPEG,PNG}; do
            filename=$(basename "$file")
            name="${filename%.*}"

            echo "Processing $filename..."

            # Strip background -> transparent PNG
            python3 -m rembg i -m birefnet-portrait "$file" "/tmp/headshots/${name}.png"

            # Resize and encode to WebP with high-quality alpha preserved
            # -q 80:        lossy quality for RGB channels
            # -alpha_q 90:  higher quality for alpha channel (compresses well)
            cwebp -q 80 -alpha_q 90 "/tmp/headshots/${name}.png" -resize 600 600 -o "dist/web/${name}.webp"
          done

      # --- DEPLOY ---
      - name: Deploy to 'dist' branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "🚀 Update Web and Print assets"