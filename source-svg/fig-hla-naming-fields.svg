<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 960 300"
  width="960"
  height="300"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .name { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 72px; }
      .lbl { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; }
      .desc { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .sep-note { font-family: ArialMT, Arial; font-size: 16px; fill: #999; }
      .prefix { fill: #4c86c5; }
      .gene { fill: #2d6a4f; }
      .f1 { fill: #e67e22; }
      .f2 { fill: #c0392b; }
      .sep { fill: #999; }
    </style>
  </defs>

  <!-- Layer 1: Name + structural annotations (Prefix, Gene) -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">

    <!-- HLA name with color-coded segments -->
    <text class="name" x="480" y="80" text-anchor="middle">
      <tspan class="prefix">HLA</tspan><tspan class="sep">-</tspan><tspan class="gene">B</tspan><tspan class="sep">*</tspan><tspan class="f1">58</tspan><tspan class="sep">:</tspan><tspan class="f2">01</tspan>
    </text>

    <!-- Separator annotations -->
    <text class="sep-note" x="370" y="46" text-anchor="middle">hyphen</text>
    <text class="sep-note" x="470" y="46" text-anchor="middle">asterisk</text>
    <text class="sep-note" x="620" y="46" text-anchor="middle">colon</text>
    <line stroke="#ddd" stroke-width="1" x1="340" y1="38" x2="650" y2="38" />

    <!-- Prefix annotation -->
    <line stroke="#4c86c5" stroke-width="1.5" x1="310" y1="95" x2="180" y2="135" />
    <circle fill="#4c86c5" cx="180" cy="140" r="3" />
    <text class="lbl prefix" x="180" y="165" text-anchor="middle">Prefix</text>
    <text class="desc" x="180" y="187" text-anchor="middle">HLA system</text>

    <!-- Gene annotation -->
    <line stroke="#2d6a4f" stroke-width="1.5" x1="430" y1="95" x2="370" y2="135" />
    <circle fill="#2d6a4f" cx="370" cy="140" r="3" />
    <text class="lbl gene" x="370" y="165" text-anchor="middle">Gene</text>
    <text class="desc" x="370" y="187" text-anchor="middle">B locus</text>

  </g>

  <!-- Layer 2: Resolution annotations (Field 1, Field 2) -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">

    <!-- Field 1 annotation -->
    <line stroke="#e67e22" stroke-width="1.5" x1="540" y1="95" x2="590" y2="135" />
    <circle fill="#e67e22" cx="590" cy="140" r="3" />
    <text class="lbl f1" x="590" y="165" text-anchor="middle">Field 1</text>
    <text class="desc" x="590" y="187" text-anchor="middle">Antigen group</text>
    <text class="desc" x="590" y="209" text-anchor="middle">(serologic)</text>

    <!-- Field 2 annotation -->
    <line stroke="#c0392b" stroke-width="1.5" x1="650" y1="95" x2="770" y2="135" />
    <circle fill="#c0392b" cx="770" cy="140" r="3" />
    <text class="lbl f2" x="770" y="165" text-anchor="middle">Field 2</text>
    <text class="desc" x="770" y="187" text-anchor="middle">Specific protein</text>
    <text class="desc" x="770" y="209" text-anchor="middle">(molecular)</text>

    <!-- Low vs high resolution note -->
    <text class="desc" x="590" y="252" text-anchor="middle">Low resolution</text>
    <text class="desc" x="770" y="252" text-anchor="middle">High resolution</text>
    <line stroke="#e67e22" stroke-width="1" stroke-dasharray="4 3" x1="590" y1="218" x2="590" y2="236" />
    <line stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3" x1="770" y1="218" x2="770" y2="236" />

  </g>

</svg>
