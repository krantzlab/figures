  <text x="1190" y="674" text-anchor="middle" style="font-family: ArialMT, Arial; font-size:20px; fill:#333;">
    <tspan style="font-weight:700; fill:#c0392b;">Drug well (110)</tspan>
    <tspan> − </tspan>
    <tspan style="font-weight:700; fill:#4c86c5;">Neg control (10)</tspan>
    <tspan> = </tspan>
    <tspan style="font-weight:700; fill:#2d6a4f;">100 SFU</tspan>
  </text>

  <!-- ============================================================== -->
  <!-- BOTTOM NOTES                                                     -->
  <!-- ============================================================== -->

  <text class="note" x="100" y="730">
    <tspan style="font-weight:700; fill:#333;">Background subtraction:</tspan>
    <tspan> Each spot = one T cell secreting IFN-γ. Negative control captures non-specific activation.</tspan>
  </text>
  <text class="note" x="100" y="758">
    <tspan x="100" dy="0">Subtracting the negative control count from the drug well count isolates the </tspan>
    <tspan style="font-weight:700;">drug-specific T-cell response.</tspan>
  </text>
  <text class="note" x="100" y="798">
    <tspan style="font-weight:700; fill:#e67e22;">Positivity criteria:</tspan>
    <tspan> ≥50 SFU/10⁶ cells (background-subtracted) </tspan>
    <tspan style="font-weight:700;">and/or</tspan>
    <tspan> stimulation index ≥3× negative control (here: 110/10 = 11×).</tspan>
  </text>
  <text class="note" x="100" y="828">
    <tspan style="font-weight:700; fill:#333;">Duplicate or triplicate wells</tspan>
    <tspan> are run for each condition; results averaged before interpretation.</tspan>
  </text>

