  <text class="label-unit" x="1340" y="528" text-anchor="middle">Drug-specific response</text>

  <!-- POSITIVE result badge -->
  <rect x="1240" y="545" width="200" height="44" rx="10" fill="#2d6a4f" opacity="0.12" stroke="#2d6a4f" stroke-width="2"/>
