<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 1100 420"
  width="1100"
  height="420"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .card-bg { fill: none; stroke: #ddd; stroke-width: 1.5; }
      .header-dilemma { fill: #666; }
      .header-result { fill: #4c86c5; }
      .header-text { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #fff; }
      .scenario { font-family: ArialMT, Arial; font-size: 19px; fill: #666; }
      .drug-name { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .drug-dim { font-family: ArialMT, Arial; font-size: 22px; fill: #ccc; }
      .drug-hit { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #c0392b; }
      .culprit-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 18px; fill: #c0392b; }
      .assoc { font-family: ArialMT, Arial; font-size: 17px; fill: #4c86c5; }
      .bottom-note { font-family: ArialMT, Arial; font-size: 17px; fill: #999; }
      .question { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #999; }
      .bullet { fill: #999; }
      .bullet-dim { fill: #ddd; }
      .x-mark { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #ccc; }
    </style>
  </defs>

  <!-- Layer 1: Clinical dilemma (left card) -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">

    <!-- Left card border -->
    <rect class="card-bg" x="0" y="0" width="490" height="420" rx="12" />

    <!-- Gray header -->
    <path class="header-dilemma" d="M12,0 H478 Q490,0 490,12 V56 H0 V12 Q0,0 12,0 Z" />

    <!-- Question mark icon -->
    <circle cx="36" cy="28" r="15" fill="none" stroke="#fff" stroke-width="2.5" />
    <text x="36" y="35" text-anchor="middle" font-family="Arial-BoldMT, Arial" font-weight="700" font-size="22" fill="#fff">?</text>

    <!-- Header text -->
    <text class="header-text" x="62" y="36">Multiple Suspects</text>

    <!-- Scenario -->
    <text class="scenario" x="40" y="90">Patient with DRESS on concurrent</text>
    <text class="scenario" x="40" y="112">antibiotics</text>

    <!-- Drug list — all equal weight -->
    <circle class="bullet" cx="55" cy="158" r="5" />
    <text class="drug-name" x="72" y="165">Piperacillin-tazobactam</text>

    <circle class="bullet" cx="55" cy="208" r="5" />
    <text class="drug-name" x="72" y="215">Vancomycin</text>

    <circle class="bullet" cx="55" cy="258" r="5" />
    <text class="drug-name" x="72" y="265">Cefepime</text>

    <circle class="bullet" cx="55" cy="308" r="5" />
    <text class="drug-name" x="72" y="315">Metronidazole</text>

    <!-- Bottom question -->
    <text class="question" x="245" y="390" text-anchor="middle">Which drug caused it?</text>

  </g>

  <!-- Layer 2: HLA result (right card) -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">

    <!-- Right card border -->
    <rect class="card-bg" x="550" y="0" width="550" height="420" rx="12" />

    <!-- Blue header -->
    <path class="header-result" d="M562,0 H1088 Q1100,0 1100,12 V56 H550 V12 Q550,0 562,0 Z" />

    <!-- DNA helix icon (simplified) -->
    <line x1="572" y1="14" x2="572" y2="42" stroke="#fff" stroke-width="2.5" />
    <line x1="586" y1="14" x2="586" y2="42" stroke="#fff" stroke-width="2.5" />
    <line x1="572" y1="20" x2="586" y2="20" stroke="#fff" stroke-width="1.5" />
    <line x1="572" y1="28" x2="586" y2="28" stroke="#fff" stroke-width="1.5" />
    <line x1="572" y1="36" x2="586" y2="36" stroke="#fff" stroke-width="1.5" />

    <!-- Header text -->
    <text class="header-text" x="600" y="36">HLA-A*32:01 Positive</text>

    <!-- Scenario -->
    <text class="scenario" x="590" y="90">HLA result narrows causality:</text>

    <!-- Drug list — vancomycin highlighted, others dimmed -->
    <text class="drug-dim" x="590" y="165">Piperacillin-tazobactam</text>

    <!-- Vancomycin — highlighted -->
    <rect fill="#c0392b" opacity="0.08" x="575" y="188" width="510" height="40" rx="6" />
    <text class="drug-hit" x="590" y="215">▸ Vancomycin</text>
    <text class="culprit-label" x="770" y="215">— Most probable culprit</text>

    <text class="drug-dim" x="590" y="265">Cefepime</text>

    <text class="drug-dim" x="590" y="315">Metronidazole</text>

    <!-- Association note -->
    <text class="assoc" x="590" y="358">HLA-A*32:01 strongly associated with</text>
    <text class="assoc" x="590" y="378">vancomycin-induced DRESS</text>

    <!-- Bottom note -->
    <text class="bottom-note" x="825" y="410" text-anchor="middle">Low population PPV → high clinical utility for adjudication</text>

  </g>

</svg>
