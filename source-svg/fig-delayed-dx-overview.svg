<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 960 410"
  width="960"
  height="410"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .test-name { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 26px; fill: #212529; }
      .val { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 30px; }
      .tick { font-family: ArialMT, Arial; font-size: 18px; fill: #212529; }
      .ax-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .note { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
    </style>
  </defs>

  <!-- Layer 1: Structure + Patch Testing -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">
    <!-- Faint gridlines at 0%, 50%, 100% -->
    <line x1="280" y1="55" x2="280" y2="315" stroke="#e8e8e8" stroke-width="1" />
    <line x1="580" y1="55" x2="580" y2="315" stroke="#e8e8e8" stroke-width="1" />
    <line x1="880" y1="55" x2="880" y2="315" stroke="#e8e8e8" stroke-width="1" />

    <!-- X-axis ticks -->
    <text class="tick" x="280" y="342" text-anchor="middle">0%</text>
    <text class="tick" x="580" y="342" text-anchor="middle">50%</text>
    <text class="tick" x="880" y="342" text-anchor="middle">100%</text>

    <!-- Axis label -->
    <text class="ax-label" x="580" y="374" text-anchor="middle">Sensitivity</text>

    <!-- Patch Testing: 40-55% → x=520 to x=610 -->
    <text class="test-name" x="260" y="105" text-anchor="end">Patch Testing</text>
    <rect x="520" y="82" width="90" height="36" rx="18" fill="#4c86c5" />
    <text class="val" x="624" y="108" fill="#4c86c5">40–55%</text>
  </g>

  <!-- Layer 2: Delayed IDT -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">
    <!-- Delayed IDT: 60-70% → x=640 to x=700 -->
    <text class="test-name" x="260" y="205" text-anchor="end">Delayed IDT</text>
    <rect x="640" y="182" width="60" height="36" rx="18" fill="#2d6a4f" />
    <text class="val" x="714" y="208" fill="#2d6a4f">60–70%</text>
  </g>

  <!-- Layer 3: ELISpot + footnote -->
  <g inkscape:groupmode="layer" id="layer3" inkscape:label="layer3">
    <!-- ELISpot: 60-75% → x=640 to x=730 -->
    <text class="test-name" x="260" y="305" text-anchor="end">ELISpot</text>
    <rect x="640" y="282" width="90" height="36" rx="18" fill="#8e44ad" />
    <text class="val" x="744" y="308" fill="#8e44ad">60–75%</text>

    <!-- Specificity footnote -->
    <text class="note" x="580" y="404" text-anchor="middle">All tests: specificity ≥95%</text>
  </g>

</svg>
