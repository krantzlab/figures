  <defs
     id="defs1">
    <style
       id="style1">
      .text-title { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 26px; fill: #212529; }
      .text-heading { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #212529; }
      .text-label { font-family: ArialMT, Arial; font-size: 20px; fill: #212529; }
      .text-label-bold { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .text-result { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 28px; }
      .text-time { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #4c86c5; }
      .text-small { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .skin { fill: #d0c4b5; stroke: #000; stroke-width: 3; stroke-miterlimit: 10; }
      .wheal-neg { fill: #d0c4b5; stroke: #b3b3b3; stroke-width: 2; stroke-dasharray: 3 3; }
      .wheal-pos { fill: #fab1a0; stroke: #c0392b; stroke-width: 3; }
      .papule { fill: #e74c3c; opacity: 0.4; }
      .line-measure { fill: none; stroke: #000; stroke-width: 2; stroke-miterlimit: 10; }
      .line-divider { fill: none; stroke: #b3b3b3; stroke-width: 2; stroke-dasharray: 6 6; stroke-miterlimit: 10; }
