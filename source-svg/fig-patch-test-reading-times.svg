  <!-- 0h=160, scale: (1240-160)/168 = 6.43 px/hr                      -->
  <!-- 48h: 160+309=469, 72h: 160+463=623, 96h: 160+617=777, 168h: 1240 -->
  <!-- Actually let's space them more readably:                          -->
  <!-- 0h=160, 48h=460, 72h=660, 96h=860, 168h=1300                    -->
  <!-- ================================================================ -->
