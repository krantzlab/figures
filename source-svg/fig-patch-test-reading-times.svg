  <defs
     id="defs1">
    <style
       id="style1">
      .label-bold { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .label-action { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; }
      .label-time { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #4c86c5; }
      .label-time-sub { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
      .label-pct { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 36px; }
