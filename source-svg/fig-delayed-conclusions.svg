<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 1100 300"
  width="1100"
  height="300"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .card-bg { fill: none; stroke: #ddd; stroke-width: 1.5; }
      .header-value { fill: #2d6a4f; }
      .header-limits { fill: #e67e22; }
      .header-need { fill: #c0392b; }
      .header-text { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #fff; }
      .body-text { font-family: ArialMT, Arial; font-size: 20px; fill: #212529; }
      .body-em { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #212529; }
    </style>
  </defs>

  <!-- Layer 1: Card 1 — Value + limitations -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">
    <rect class="card-bg" x="0" y="0" width="340" height="300" rx="12" />
    <path class="header-value" d="M12,0 H328 Q340,0 340,12 V56 H0 V12 Q0,0 12,0 Z" />
    <text class="header-text" x="170" y="36" text-anchor="middle">Valuable but Limited</text>

    <text class="body-text" x="170" y="110" text-anchor="middle">Delayed testing aids</text>
    <text class="body-em" x="170" y="140" text-anchor="middle">diagnosis, causality,</text>
    <text class="body-em" x="170" y="170" text-anchor="middle">and risk stratification</text>
    <text class="body-text" x="170" y="220" text-anchor="middle">but no test achieves</text>
    <text class="body-text" x="170" y="250" text-anchor="middle">100% sensitivity or NPV</text>
  </g>

  <!-- Layer 2: Card 2 — Sensitivity varies -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">
    <rect class="card-bg" x="380" y="0" width="340" height="300" rx="12" />
    <path class="header-limits" d="M392,0 H708 Q720,0 720,12 V56 H380 V12 Q380,0 392,0 Z" />
    <text class="header-text" x="550" y="36" text-anchor="middle">Sensitivity Varies</text>

    <text class="body-text" x="550" y="120" text-anchor="middle">Depends on</text>
    <text class="body-em" x="550" y="160" text-anchor="middle">modality</text>
    <text class="body-em" x="550" y="200" text-anchor="middle">phenotype</text>
    <text class="body-em" x="550" y="240" text-anchor="middle">timing from reaction</text>
  </g>

  <!-- Layer 3: Card 3 — Concentrations -->
  <g inkscape:groupmode="layer" id="layer3" inkscape:label="layer3">
    <rect class="card-bg" x="760" y="0" width="340" height="300" rx="12" />
    <path class="header-need" d="M772,0 H1088 Q1100,0 1100,12 V56 H760 V12 Q760,0 772,0 Z" />
    <text class="header-text" x="930" y="36" text-anchor="middle">Unmet Need</text>

    <text class="body-text" x="930" y="120" text-anchor="middle">Skin test concentrations</text>
    <text class="body-text" x="930" y="150" text-anchor="middle">for delayed reactions</text>
    <text class="body-text" x="930" y="200" text-anchor="middle">need to be</text>
    <text class="body-em" x="930" y="240" text-anchor="middle">validated and standardized</text>
  </g>

</svg>
