<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 620 130"
  width="620"
  height="130"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .card-bg { fill: none; stroke: #ddd; stroke-width: 1.5; }
      .header-alert { fill: #c0392b; }
      .header-text { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #fff; }
      .body-text { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
    </style>
  </defs>

  <!-- Layer 1: Warning card -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">

    <!-- Card border -->
    <rect class="card-bg" x="0" y="0" width="620" height="130" rx="12" />

    <!-- Red header with rounded top corners -->
    <path class="header-alert" d="M12,0 H608 Q620,0 620,12 V56 H0 V12 Q0,0 12,0 Z" />

    <!-- Stop sign octagon icon -->
    <polygon points="42,14 50,22 50,34 42,42 30,42 22,34 22,22 30,14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="27" y1="28" x2="45" y2="28" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Header text -->
    <text class="header-text" x="62" y="36">No Delayed Test Achieves 100% NPV</text>

    <!-- Body text -->
    <text class="body-text" x="310" y="100" text-anchor="middle">A negative result does not rule out delayed drug hypersensitivity</text>

  </g>

</svg>
