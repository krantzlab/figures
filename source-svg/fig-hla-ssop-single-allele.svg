<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 1100 480"
  width="1100"
  height="480"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .title { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 28px; fill: #212529; }
      .subtitle { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
      .step-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .step-desc { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .step-num { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 16px; fill: #fff; }
      .probe-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 16px; fill: #212529; }
      .probe-ring { fill: #f5f0e8; stroke: #a89888; stroke-width: 2; }
      .probe-pos { fill: #4c86c5; stroke: #3a6fa0; stroke-width: 2; }
      .probe-neg { fill: #f5f0e8; stroke: #a89888; stroke-width: 2; }
      .pos-marker { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #4c86c5; }
      .neg-marker { font-family: ArialMT, Arial; font-size: 20px; fill: #999; }
      .arrow-line { fill: none; stroke: #212529; stroke-width: 2; }
      .arrow-head { fill: #212529; }
      .result-box { fill: #4c86c5; opacity: 0.08; }
      .result-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 26px; fill: #4c86c5; }
      .result-detail { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
      .dna-strand { fill: none; stroke: #212529; stroke-width: 2; }
      .pcr-box { fill: none; stroke: #4c86c5; stroke-width: 2; rx: 6; }
      .pcr-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #4c86c5; }
      .note { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .pattern-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 18px; fill: #212529; }
    </style>
  </defs>

  <!-- Layer 1: SSOP assay setup -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">

    <!-- Title -->
    <text class="title" x="550" y="32" text-anchor="middle">SSOP Single-Allele Assay</text>
    <text class="subtitle" x="550" y="58" text-anchor="middle">Sequence-Specific Oligonucleotide Probing for HLA-B*58:01</text>

    <!-- Step 1: Patient DNA -->
    <circle fill="#4c86c5" cx="90" cy="110" r="14" />
    <text class="step-num" x="90" y="115" text-anchor="middle">1</text>
    <text class="step-label" x="112" y="116">Patient DNA</text>

    <!-- DNA double helix simplified -->
    <line class="dna-strand" x1="80" y1="140" x2="80" y2="190" />
    <line class="dna-strand" x1="100" y1="140" x2="100" y2="190" />
    <!-- Rungs -->
    <line stroke="#999" stroke-width="1.5" x1="80" y1="150" x2="100" y2="150" />
    <line stroke="#999" stroke-width="1.5" x1="80" y1="160" x2="100" y2="160" />
    <line stroke="#999" stroke-width="1.5" x1="80" y1="170" x2="100" y2="170" />
    <line stroke="#999" stroke-width="1.5" x1="80" y1="180" x2="100" y2="180" />

    <!-- Arrow to PCR -->
    <line class="arrow-line" x1="130" y1="165" x2="200" y2="165" />
    <polygon class="arrow-head" points="200,160 200,170 212,165" />

    <!-- Step 2: PCR Amplification -->
    <circle fill="#4c86c5" cx="270" cy="110" r="14" />
    <text class="step-num" x="270" y="115" text-anchor="middle">2</text>
    <text class="step-label" x="292" y="116">PCR Amplify</text>

    <rect class="pcr-box" x="220" y="140" width="100" height="50" rx="6" />
    <text class="pcr-label" x="270" y="170" text-anchor="middle">PCR</text>

    <!-- Arrow to probes -->
    <line class="arrow-line" x1="340" y1="165" x2="410" y2="165" />
    <polygon class="arrow-head" points="410,160 410,170 422,165" />

    <!-- Step 3: Hybridize to probe panel -->
    <circle fill="#4c86c5" cx="480" cy="110" r="14" />
    <text class="step-num" x="480" y="115" text-anchor="middle">3</text>
    <text class="step-label" x="502" y="116">Hybridize to SSO Probes</text>

    <!-- Probe panel: row of 8 beads -->
    <circle class="probe-ring" cx="450" cy="200" r="22" />
    <text class="probe-label" x="450" y="205" text-anchor="middle">P1</text>

    <circle class="probe-ring" cx="510" cy="200" r="22" />
    <text class="probe-label" x="510" y="205" text-anchor="middle">P2</text>

    <circle class="probe-ring" cx="570" cy="200" r="22" />
    <text class="probe-label" x="570" y="205" text-anchor="middle">P3</text>

    <circle class="probe-ring" cx="630" cy="200" r="22" />
    <text class="probe-label" x="630" y="205" text-anchor="middle">P4</text>

    <circle class="probe-ring" cx="690" cy="200" r="22" />
    <text class="probe-label" x="690" y="205" text-anchor="middle">P5</text>

    <circle class="probe-ring" cx="750" cy="200" r="22" />
    <text class="probe-label" x="750" y="205" text-anchor="middle">P6</text>

    <circle class="probe-ring" cx="810" cy="200" r="22" />
    <text class="probe-label" x="810" y="205" text-anchor="middle">P7</text>

    <circle class="probe-ring" cx="870" cy="200" r="22" />
    <text class="probe-label" x="870" y="205" text-anchor="middle">P8</text>

    <!-- Note about probes -->
    <text class="step-desc" x="660" y="250" text-anchor="middle">Each probe targets a specific polymorphic sequence</text>

  </g>

  <!-- Layer 2: Results -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">

    <!-- Step 4 label -->
    <circle fill="#4c86c5" cx="480" cy="290" r="14" />
    <text class="step-num" x="480" y="295" text-anchor="middle">4</text>
    <text class="step-label" x="502" y="296">Read hybridization pattern</text>

    <!-- Result beads: positive (blue) and negative (gray) -->
    <circle class="probe-pos" cx="450" cy="340" r="22" />
    <text class="pos-marker" x="450" y="346" text-anchor="middle">+</text>

    <circle class="probe-pos" cx="510" cy="340" r="22" />
    <text class="pos-marker" x="510" y="346" text-anchor="middle">+</text>

    <circle class="probe-neg" cx="570" cy="340" r="22" />
    <text class="neg-marker" x="570" y="346" text-anchor="middle">−</text>

    <circle class="probe-pos" cx="630" cy="340" r="22" />
    <text class="pos-marker" x="630" y="346" text-anchor="middle">+</text>

    <circle class="probe-neg" cx="690" cy="340" r="22" />
    <text class="neg-marker" x="690" y="346" text-anchor="middle">−</text>

    <circle class="probe-pos" cx="750" cy="340" r="22" />
    <text class="pos-marker" x="750" y="346" text-anchor="middle">+</text>

    <circle class="probe-pos" cx="810" cy="340" r="22" />
    <text class="pos-marker" x="810" y="346" text-anchor="middle">+</text>

    <circle class="probe-neg" cx="870" cy="340" r="22" />
    <text class="neg-marker" x="870" y="346" text-anchor="middle">−</text>

    <!-- Pattern label -->
    <text class="pattern-label" x="660" y="385" text-anchor="middle">Pattern: + + − + − + + −</text>

    <!-- Arrow to result -->
    <line class="arrow-line" x1="660" y1="395" x2="660" y2="415" />
    <polygon class="arrow-head" points="655,415 665,415 660,425" />

    <!-- Result box -->
    <rect class="result-box" x="380" y="428" width="560" height="48" rx="10" />
    <text class="result-label" x="660" y="460" text-anchor="middle">HLA-B*58:01 Detected</text>

  </g>

</svg>
