<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 900 580"
  width="900"
  height="580"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .legend-text { font-family: ArialMT, Arial; font-size: 20px; fill: #212529; }
      .pheno { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #212529; }
      .tick { font-family: ArialMT, Arial; font-size: 18px; fill: #212529; }
      .ax-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .annotation { font-family: ArialMT, Arial; font-size: 16px; fill: #666; }
      .contra { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 18px; fill: #c0392b; }
      .note { font-family: ArialMT, Arial; font-size: 17px; fill: #666; }
    </style>
  </defs>

  <!-- Layer 1: Structure + Patch Testing data -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">
    <!-- Legend -->
    <circle cx="310" cy="30" r="7" fill="#4c86c5" />
    <text class="legend-text" x="324" y="36">Patch Testing</text>
    <circle cx="470" cy="30" r="7" fill="#2d6a4f" />
    <text class="legend-text" x="484" y="36">Delayed IDT</text>
    <circle cx="620" cy="30" r="7" fill="#8e44ad" />
    <text class="legend-text" x="634" y="36">ELISpot</text>

    <!-- Gridlines: 0%, 25%, 50%, 75%, 100% -->
    <!-- x(%) = 220 + % * 6 -->
    <line x1="220" y1="70" x2="220" y2="505" stroke="#e8e8e8" stroke-width="1" />
    <line x1="370" y1="70" x2="370" y2="505" stroke="#e8e8e8" stroke-width="1" />
    <line x1="520" y1="70" x2="520" y2="505" stroke="#e8e8e8" stroke-width="1" />
    <line x1="670" y1="70" x2="670" y2="505" stroke="#e8e8e8" stroke-width="1" />
    <line x1="820" y1="70" x2="820" y2="505" stroke="#e8e8e8" stroke-width="1" />

    <!-- Row separators -->
    <line x1="220" y1="160" x2="820" y2="160" stroke="#f0f0f0" stroke-width="1" />
    <line x1="220" y1="250" x2="820" y2="250" stroke="#f0f0f0" stroke-width="1" />
    <line x1="220" y1="340" x2="820" y2="340" stroke="#f0f0f0" stroke-width="1" />
    <line x1="220" y1="430" x2="820" y2="430" stroke="#f0f0f0" stroke-width="1" />

    <!-- Phenotype labels -->
    <text class="pheno" x="200" y="125" text-anchor="end">MPE</text>
    <text class="pheno" x="200" y="215" text-anchor="end">FDE</text>
    <text class="pheno" x="200" y="305" text-anchor="end">AGEP</text>
    <text class="pheno" x="200" y="395" text-anchor="end">DRESS</text>
    <text class="pheno" x="200" y="485" text-anchor="end">SJS/TEN</text>

    <!-- X-axis ticks -->
    <text class="tick" x="220" y="528" text-anchor="middle">0%</text>
    <text class="tick" x="520" y="528" text-anchor="middle">50%</text>
    <text class="tick" x="820" y="528" text-anchor="middle">100%</text>

    <!-- Axis label -->
    <text class="ax-label" x="520" y="555" text-anchor="middle">Sensitivity</text>

    <!-- ===== PATCH TESTING DATA (blue) ===== -->
    <!-- Within each row: Patch at y_row-16, IDT at y_row, ELISpot at y_row+16 -->

    <!-- MPE: 52% -->
    <circle cx="532" cy="104" r="8" fill="#4c86c5" />

    <!-- FDE: ~50% (lesion site) -->
    <circle cx="520" cy="194" r="8" fill="#4c86c5" />
    <text class="annotation" x="536" y="190">(lesion site)</text>

    <!-- AGEP: 58-64%, mid 61% -->
    <line x1="568" y1="284" x2="604" y2="284" stroke="#4c86c5" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <circle cx="586" cy="284" r="8" fill="#4c86c5" />

    <!-- DRESS: 32-80%, mid ~50% -->
    <line x1="412" y1="374" x2="700" y2="374" stroke="#4c86c5" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <circle cx="520" cy="374" r="8" fill="#4c86c5" />

    <!-- SJS/TEN: 9-24%, mid ~17% -->
    <line x1="274" y1="464" x2="364" y2="464" stroke="#4c86c5" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <circle cx="322" cy="464" r="8" fill="#4c86c5" />
  </g>

  <!-- Layer 2: Delayed IDT data -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">
    <!-- MPE: 70% -->
    <circle cx="640" cy="120" r="8" fill="#2d6a4f" />

    <!-- FDE: ~50%, limited data (open dashed circle) -->
    <circle cx="520" cy="210" r="7" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="4,3" />

    <!-- AGEP: 60% -->
    <circle cx="580" cy="300" r="8" fill="#2d6a4f" />

    <!-- DRESS: 65% -->
    <circle cx="610" cy="390" r="8" fill="#2d6a4f" />

    <!-- SJS/TEN: Contraindicated -->
    <text class="contra" x="520" y="485" text-anchor="middle">&#x2715; Contraindicated</text>
  </g>

  <!-- Layer 3: ELISpot data -->
  <g inkscape:groupmode="layer" id="layer3" inkscape:label="layer3">
    <!-- DRESS: 75% -->
    <circle cx="670" cy="406" r="8" fill="#8e44ad" />

    <!-- SJS/TEN: 75% -->
    <circle cx="670" cy="496" r="8" fill="#8e44ad" />

    <!-- Note -->
    <text class="note" x="820" y="575" text-anchor="end">ELISpot indicated for severe reactions only</text>
  </g>

</svg>
