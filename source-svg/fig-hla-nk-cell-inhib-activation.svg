         y="43.200001"
         id="tspan8">**Peptides bound by HLA class I fine-tune binding strength with KIR</tspan><tspan
         x="0"
         y="86.400002"
         id="tspan9">***Major peptide bound by HLA-E is 9mer from the leader sequence of HLA-A, -B, -C</tspan></text>
