<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 1600 900" width="1600" height="900"
   sodipodi:docname="fig-elispot-3.svg"
   inkscape:version="1.4 (e7c3feb1, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#000000" borderopacity="0.25"
     inkscape:showpageshadow="2" inkscape:pageopacity="0.0" inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1" inkscape:zoom="0.5" inkscape:cx="800" inkscape:cy="450"
     inkscape:window-width="1512" inkscape:window-height="746" inkscape:window-x="0"
     inkscape:window-y="75" inkscape:window-maximized="0" inkscape:current-layer="svg1">
    <sodipodi:guide position="80,0" orientation="-1,0" id="gl" inkscape:locked="false" inkscape:label="left-margin" inkscape:color="rgb(0,134,229)"/>
    <sodipodi:guide position="1520,0" orientation="-1,0" id="gr" inkscape:locked="false" inkscape:label="right-margin" inkscape:color="rgb(0,134,229)"/>
    <sodipodi:guide position="0,880" orientation="0,1" id="gt" inkscape:locked="false" inkscape:label="top-margin" inkscape:color="rgb(0,134,229)"/>
    <sodipodi:guide position="0,20" orientation="0,1" id="gb" inkscape:locked="false" inkscape:label="bottom-margin" inkscape:color="rgb(0,134,229)"/>
  </sodipodi:namedview>
  <defs>
    <style>
      .ax-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #333; }
      .ax-tick { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
      .bar-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; }
      .bar-sub { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
      .bar-value { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 28px; }
      .note { font-family: ArialMT, Arial; font-size: 20px; fill: #555; }
      .note-em { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; }
    </style>
  </defs>

  <!-- ============================================================== -->
  <!-- BAR CHART: ELISpot Results Interpretation                       -->
  <!-- Plot area: x=280-1400, y=60-640                                 -->
  <!-- Y-axis: SFU/10^6 cells, 0-350                                  -->
  <!-- 0=640, 50=557, 100=474, 150=391, 200=309, 250=226, 300=143, 350=60 -->
  <!-- Scale: 1 SFU = 1.657px, y = 640 - (val * 1.657)                -->
  <!-- Bar centers: 520, 800, 1080                                     -->
  <!-- Bar width: 200                                                  -->
  <!-- ============================================================== -->

  <!-- Y-AXIS -->
  <line x1="280" y1="60" x2="280" y2="640" stroke="#999" stroke-width="2"/>
  <!-- X-AXIS -->
  <line x1="280" y1="640" x2="1400" y2="640" stroke="#999" stroke-width="2"/>

  <!-- Y-axis label -->
  <text class="ax-label" x="40" y="350" text-anchor="middle" transform="rotate(-90,40,350)">SFU / 10⁶ cells</text>

  <!-- Y-axis ticks -->
  <line x1="270" y1="640" x2="280" y2="640" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="647" text-anchor="end">0</text>

  <line x1="270" y1="557" x2="280" y2="557" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="564" text-anchor="end">50</text>

  <line x1="270" y1="474" x2="280" y2="474" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="481" text-anchor="end">100</text>

  <line x1="270" y1="391" x2="280" y2="391" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="398" text-anchor="end">150</text>

  <line x1="270" y1="309" x2="280" y2="309" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="316" text-anchor="end">200</text>

  <line x1="270" y1="226" x2="280" y2="226" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="233" text-anchor="end">250</text>

  <line x1="270" y1="143" x2="280" y2="143" stroke="#999" stroke-width="2"/>
  <text class="ax-tick" x="260" y="150" text-anchor="end">300</text>

  <!-- Light gridlines -->
  <line x1="280" y1="557" x2="1400" y2="557" stroke="#eee" stroke-width="1"/>
  <line x1="280" y1="474" x2="1400" y2="474" stroke="#eee" stroke-width="1"/>
  <line x1="280" y1="391" x2="1400" y2="391" stroke="#eee" stroke-width="1"/>
  <line x1="280" y1="309" x2="1400" y2="309" stroke="#eee" stroke-width="1"/>
  <line x1="280" y1="226" x2="1400" y2="226" stroke="#eee" stroke-width="1"/>
  <line x1="280" y1="143" x2="1400" y2="143" stroke="#eee" stroke-width="1"/>

  <!-- ====== THRESHOLD LINE: ≥50 SFU ====== -->
  <line x1="280" y1="557" x2="1400" y2="557" stroke="#e67e22" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="1280" y="540" width="115" height="34" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="1338" y="564" text-anchor="middle" style="font-family: Arial-BoldMT, Arial; font-weight:700; font-size:20px; fill:#e67e22;">≥ 50 SFU</text>

  <!-- ====== BAR 1: Negative Control (10 SFU) ====== -->
  <!-- y = 640 - (10 * 1.657) = 640 - 16.6 = 623.4 -->
  <rect x="420" y="623" width="200" height="17" rx="4" fill="#ccddec" stroke="#4c86c5" stroke-width="2"/>
  <!-- Value -->
  <text class="bar-value" x="520" y="614" text-anchor="middle" fill="#4c86c5">10</text>
  <!-- X-axis label -->
  <line x1="520" y1="640" x2="520" y2="654" stroke="#999" stroke-width="2"/>
  <text class="bar-label" x="520" y="682" text-anchor="middle" fill="#4c86c5">Negative Control</text>
  <text class="bar-sub" x="520" y="708" text-anchor="middle">(cell media only)</text>

  <!-- ====== BAR 2: Positive Control (300 SFU) ====== -->
  <!-- y = 640 - (300 * 1.657) = 640 - 497.1 = 143 -->
  <rect x="700" y="143" width="200" height="497" rx="4" fill="#2d6a4f" opacity="0.2" stroke="#2d6a4f" stroke-width="2"/>
  <!-- Value -->
  <text class="bar-value" x="800" y="133" text-anchor="middle" fill="#2d6a4f">300</text>
  <!-- X-axis label -->
  <line x1="800" y1="640" x2="800" y2="654" stroke="#999" stroke-width="2"/>
  <text class="bar-label" x="800" y="682" text-anchor="middle" fill="#2d6a4f">Positive Control</text>
  <text class="bar-sub" x="800" y="708" text-anchor="middle">(anti-CD3)</text>

  <!-- ====== BAR 3: Drug Stimulus (100 SFU) ====== -->
  <!-- y = 640 - (100 * 1.657) = 640 - 165.7 = 474 -->
  <rect x="980" y="474" width="200" height="166" rx="4" fill="#c0392b" opacity="0.2" stroke="#c0392b" stroke-width="2"/>
  <!-- Value -->
  <text class="bar-value" x="1080" y="464" text-anchor="middle" fill="#c0392b">100</text>
  <!-- X-axis label -->
  <line x1="1080" y1="640" x2="1080" y2="654" stroke="#999" stroke-width="2"/>
  <text class="bar-label" x="1080" y="682" text-anchor="middle" fill="#c0392b">Drug Stimulus</text>
  <text class="bar-sub" x="1080" y="708" text-anchor="middle">(e.g. culprit drug)</text>

  <!-- ====== INTERPRETATION ANNOTATIONS ====== -->
  <!-- Arrow from threshold to drug bar -->
  <path d="M 1200,557 L 1250,530" fill="none" stroke="#e67e22" stroke-width="2" marker-end="none"/>

  <!-- Positive result callout -->
  <rect x="1180" y="440" width="200" height="70" rx="10" fill="#c0392b" opacity="0.1" stroke="#c0392b" stroke-width="2"/>
  <text x="1280" y="468" text-anchor="middle" style="font-family: Arial-BoldMT, Arial; font-weight:700; font-size:22px; fill:#c0392b;">POSITIVE</text>
  <text x="1280" y="496" text-anchor="middle" style="font-family: ArialMT, Arial; font-size:18px; fill:#c0392b;">100 SFU &gt; 50 threshold</text>

  <!-- Below threshold callout for negative control -->
  <rect x="380" y="730" width="280" height="36" rx="8" fill="#ccddec" stroke="#4c86c5" stroke-width="1.5"/>
  <text x="520" y="755" text-anchor="middle" style="font-family: ArialMT, Arial; font-size:18px; fill:#4c86c5;">Background: 10 SFU (below threshold)</text>

  <!-- Positive control validation -->
  <rect x="660" y="730" width="280" height="36" rx="8" fill="#2d6a4f" opacity="0.1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="800" y="755" text-anchor="middle" style="font-family: ArialMT, Arial; font-size:18px; fill:#2d6a4f;">Assay valid: robust T-cell response</text>

  <!-- ============================================================== -->
  <!-- BOTTOM: Interpretation key                                       -->
  <!-- ============================================================== -->
  <line x1="80" y1="790" x2="1520" y2="790" stroke="#ddd" stroke-width="1"/>

  <text class="note" x="100" y="828">
    <tspan style="font-weight:700; fill:#e67e22;">Positivity threshold:</tspan>
    <tspan> ≥50 SFU/10⁶ cells (background-subtracted) or stimulation index ≥3× negative control.</tspan>
  </text>
  <text class="note" x="100" y="858">
    <tspan style="font-weight:700; fill:#333;">Three wells required:</tspan>
    <tspan> Negative control validates low background; positive control confirms T-cell viability; drug well tests hypothesis.</tspan>
  </text>

</svg>
