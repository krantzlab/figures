<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 1100 350"
  width="1100"
  height="350"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .card-bg { fill: none; stroke: #ddd; stroke-width: 1.5; }
      .header-continue { fill: #2d6a4f; }
      .header-caution { fill: #e67e22; }
      .header-text { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #fff; }
      .med-name { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 24px; fill: #212529; }
      .detail { font-family: ArialMT, Arial; font-size: 20px; fill: #555; }
      .detail-em { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #e67e22; }
      .or-text { font-family: ArialMT, Arial; font-size: 18px; fill: #999; }
      .note { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .bullet-continue { fill: #2d6a4f; }
      .bullet-caution { fill: #e67e22; }
    </style>
  </defs>

  <!-- Layer 1: Continue medications -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">

    <!-- Left Card: Okay to Continue -->
    <rect class="card-bg" x="0" y="0" width="490" height="350" rx="12" />

    <!-- Green header strip with rounded top corners -->
    <path class="header-continue" d="M12,0 H478 Q490,0 490,12 V56 H0 V12 Q0,0 12,0 Z" />

    <!-- Checkmark icon in header -->
    <circle cx="36" cy="28" r="15" fill="none" stroke="#fff" stroke-width="2.5" />
    <polyline points="28,28 34,34 45,22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Header text -->
    <text class="header-text" x="62" y="36">Okay to Continue</text>

    <!-- Antihistamines -->
    <circle class="bullet-continue" cx="40" cy="126" r="6" />
    <text class="med-name" x="62" y="134">Antihistamines</text>

    <!-- Beta-blockers -->
    <circle class="bullet-continue" cx="40" cy="200" r="6" />
    <text class="med-name" x="62" y="208">Beta-blockers</text>

    <!-- Note -->
    <text class="note" x="40" y="316">No effect on T-cell–mediated reactions</text>

  </g>

  <!-- Layer 2: Hold/reduce medication -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">

    <!-- Right Card: Must Hold or Reduce -->
    <rect class="card-bg" x="550" y="0" width="550" height="350" rx="12" />

    <!-- Orange header strip with rounded top corners -->
    <path class="header-caution" d="M562,0 H1088 Q1100,0 1100,12 V56 H550 V12 Q550,0 562,0 Z" />

    <!-- Warning triangle icon in header -->
    <path d="M586,14 L572,42 L600,42 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="586" y1="24" x2="586" y2="34" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="586" cy="38" r="1.5" fill="#fff" />

    <!-- Header text -->
    <text class="header-text" x="612" y="36">Must Hold or Reduce</text>

    <!-- Systemic Steroids -->
    <circle class="bullet-caution" cx="590" cy="118" r="6" />
    <text class="med-name" x="612" y="126">Systemic Steroids</text>

    <!-- Condition: Off >= 1 month -->
    <text class="detail" x="612" y="178">Off ≥ 1 month</text>

    <!-- Or divider -->
    <text class="or-text" x="612" y="212">— or —</text>

    <!-- Condition: prednisone equivalent <= 10 mg/day -->
    <text class="detail" x="612" y="248">Prednisone equivalent</text>
    <text class="detail-em" x="612" y="276">≤ 10 mg/day</text>

    <!-- Note -->
    <text class="note" x="590" y="328">Suppresses T-cell–mediated responses</text>

  </g>

</svg>
