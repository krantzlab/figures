      .allele-name { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 28px; }
      .note { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .vs-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .diff-label { font-family: ArialMT, Arial; font-size: 18px; fill: #c0392b; }
    </style>
