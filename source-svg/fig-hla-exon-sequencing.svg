<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  version="1.1"
  viewBox="0 0 1100 500"
  width="1100"
  height="500"
  id="svg1"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:svg="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .title { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 28px; fill: #212529; }
      .subtitle { font-family: ArialMT, Arial; font-size: 20px; fill: #666; }
      .exon-fill { fill: #e0e0e0; stroke: #212529; stroke-width: 2; }
      .exon-highlight { fill: #c0392b; opacity: 0.15; stroke: #c0392b; stroke-width: 2.5; }
      .intron { fill: none; stroke: #212529; stroke-width: 2; }
      .exon-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 18px; fill: #212529; }
      .exon-label-hi { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 18px; fill: #c0392b; }
      .domain-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #212529; }
      .domain-sub { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .bracket { fill: none; stroke: #c0392b; stroke-width: 2; }
      .bracket-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #c0392b; }
      .seq-arrow { fill: none; stroke: #4c86c5; stroke-width: 2; }
      .seq-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 20px; fill: #4c86c5; }
      .allele-name { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 28px; }
      .note { font-family: ArialMT, Arial; font-size: 18px; fill: #666; }
      .vs-label { font-family: Arial-BoldMT, Arial; font-weight: 700; font-size: 22px; fill: #212529; }
      .diff-label { font-family: ArialMT, Arial; font-size: 18px; fill: #c0392b; }
    </style>
  </defs>

  <!-- Layer 1: Gene structure -->
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="layer1">

    <!-- Title -->
    <text class="title" x="550" y="32" text-anchor="middle">Sequence-Based Typing (SBT)</text>
    <text class="subtitle" x="550" y="58" text-anchor="middle">Sequencing exon 2 &amp; 3 → Field 2 (specific protein)</text>

    <!-- Gene label -->
    <text class="domain-label" x="50" y="130" text-anchor="start">HLA-B gene</text>

    <!-- Intron line (backbone) -->
    <line class="intron" x1="50" y1="175" x2="1050" y2="175" />

    <!-- Exon 1: Leader -->
    <rect class="exon-fill" x="80" y="155" width="50" height="40" rx="3" />
    <text class="exon-label" x="105" y="180" text-anchor="middle">E1</text>
    <text class="domain-sub" x="105" y="215" text-anchor="middle">Leader</text>

    <!-- Exon 2: α1 domain (HIGHLIGHTED) -->
    <rect class="exon-highlight" x="210" y="150" width="140" height="50" rx="3" />
    <text class="exon-label-hi" x="280" y="182" text-anchor="middle">Exon 2</text>
    <text class="domain-label" x="280" y="225" text-anchor="middle">α1</text>

    <!-- Exon 3: α2 domain (HIGHLIGHTED) -->
    <rect class="exon-highlight" x="430" y="150" width="140" height="50" rx="3" />
    <text class="exon-label-hi" x="500" y="182" text-anchor="middle">Exon 3</text>
    <text class="domain-label" x="500" y="225" text-anchor="middle">α2</text>

    <!-- Exon 4: α3 domain -->
    <rect class="exon-fill" x="640" y="155" width="100" height="40" rx="3" />
    <text class="exon-label" x="690" y="180" text-anchor="middle">E4</text>
    <text class="domain-sub" x="690" y="215" text-anchor="middle">α3</text>

    <!-- Exon 5: TM -->
    <rect class="exon-fill" x="810" y="155" width="60" height="40" rx="3" />
    <text class="exon-label" x="840" y="180" text-anchor="middle">E5</text>
    <text class="domain-sub" x="840" y="215" text-anchor="middle">TM</text>

    <!-- Exon 6-7: Cytoplasmic -->
    <rect class="exon-fill" x="940" y="155" width="40" height="40" rx="3" />
    <text class="exon-label" x="960" y="180" text-anchor="middle">E6</text>
    <rect class="exon-fill" x="1000" y="155" width="30" height="40" rx="3" />
    <text class="exon-label" x="1015" y="180" text-anchor="middle">7</text>
    <text class="domain-sub" x="985" y="215" text-anchor="middle">Cyto</text>

    <!-- Bracket under exon 2 & 3: peptide binding groove -->
    <path class="bracket" d="M215,248 L215,260 L565,260 L565,248" />
    <line class="bracket" x1="390" y1="260" x2="390" y2="275" />
    <text class="bracket-label" x="390" y="298" text-anchor="middle">Peptide binding groove</text>

  </g>

  <!-- Layer 2: Sequencing result -->
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="layer2">

    <!-- Sequencing arrows over exon 2 & 3 -->
    <line class="seq-arrow" x1="210" y1="138" x2="350" y2="138" marker-end="url(#seq-arrow-head)" />
    <line class="seq-arrow" x1="570" y1="138" x2="430" y2="138" marker-end="url(#seq-arrow-head)" />
    <text class="seq-label" x="390" y="132" text-anchor="middle">Sequencing</text>

    <!-- Forward arrow -->
    <polygon fill="#4c86c5" points="350,133 350,143 360,138" />
    <!-- Reverse arrow -->
    <polygon fill="#4c86c5" points="430,133 430,143 420,138" />

    <!-- Allele resolution comparison -->
    <rect fill="#f5f0e8" x="140" y="340" width="380" height="120" rx="10" />
    <rect fill="#f5f0e8" x="580" y="340" width="380" height="120" rx="10" />

    <!-- Allele 1 -->
    <text class="allele-name" x="330" y="380" text-anchor="middle">
      <tspan fill="#212529">HLA-B*58:</tspan><tspan fill="#c0392b">01</tspan>
    </text>
    <text class="note" x="330" y="408" text-anchor="middle">...Asp-114, Trp-147...</text>
    <text class="domain-sub" x="330" y="435" text-anchor="middle">Allopurinol hypersensitivity</text>

    <!-- vs -->
    <text class="vs-label" x="550" y="405" text-anchor="middle">vs</text>

    <!-- Allele 2 -->
    <text class="allele-name" x="770" y="380" text-anchor="middle">
      <tspan fill="#212529">HLA-B*58:</tspan><tspan fill="#c0392b">02</tspan>
    </text>
    <text class="note" x="770" y="408" text-anchor="middle">...different residues...</text>
    <text class="domain-sub" x="770" y="435" text-anchor="middle">Not associated</text>

    <!-- Bottom note -->
    <text class="diff-label" x="550" y="488" text-anchor="middle">Same antigen group, different amino acid sequence → different clinical significance</text>

  </g>

</svg>
